name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy reconforge

      - name: Pytest
        run: pytest

      - name: CLI smoke
        run: |
          reconforge doctor
          reconforge validate examples/sample_data
          reconforge rules validate --pack control-packs/audit-basic

      - name: Build package
        run: python -m build --no-isolation

  docker-parity:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Validate container build and run
        run: |
          docker --version
          docker build -t reconforge:ci-baseline .
          docker run --rm reconforge:ci-baseline reconforge doctor
          docker run --rm reconforge:ci-baseline reconforge validate examples/sample_data
          docker run --rm reconforge:ci-baseline reconforge rules validate --pack control-packs/audit-basic

  server-boundaries:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade setuptools wheel
          python -m pip install -e ".[dev,server]"

      - name: Create non-privileged PostgreSQL application role
        env:
          PGPASSWORD: postgres
        run: |
          psql --host localhost --username postgres --dbname postgres --command "CREATE ROLE reconforge_app LOGIN PASSWORD 'reconforge_app'"

      - name: Run Alembic PostgreSQL migration
        working-directory: ${{ github.workspace }}
        env:
          RECONFORGE_POSTGRES_DSN: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: |
          python -m alembic -c "${GITHUB_WORKSPACE}/alembic.ini" upgrade head

      - name: Run live server-boundary tests
        env:
          RECONFORGE_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          RECONFORGE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          RECONFORGE_TEST_POSTGRES_DSN: postgresql://reconforge_app:reconforge_app@localhost:5432/postgres
          RECONFORGE_TEST_POSTGRES_APP_USER: reconforge_app
          RECONFORGE_TEST_REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/test_postgres_foundation.py tests/test_postgres_master_data.py tests/test_postgres_ledger.py tests/test_postgres_identity.py tests/test_postgres_evidence.py tests/test_postgres_reconciliation.py tests/test_api_server_identity.py tests/test_redis_foundation.py -q
