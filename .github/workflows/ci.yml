name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --no-editable --python "${{ matrix.python-version }}"

      - name: Ruff
        run: uv run --no-sync ruff check .

      - name: Mypy
        run: uv run --no-sync mypy reconforge

      - name: Pytest
        run: uv run --no-sync pytest

      - name: CLI smoke
        run: |
          uv run --no-sync reconforge doctor
          uv run --no-sync reconforge validate examples/sample_data
          uv run --no-sync reconforge rules validate --pack control-packs/audit-basic

      - name: Build package
        run: uv run --no-sync python -m build --no-isolation

  engine-parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            dependency-profile: lower-bounds
            numpy-version: "1.26.4"
            pandas-version: "2.2.0"
            duckdb-version: "1.0.0"
          - python-version: "3.12"
            dependency-profile: lower-bounds
            numpy-version: "1.26.4"
            pandas-version: "2.2.0"
            duckdb-version: "1.0.0"
          - python-version: "3.11"
            dependency-profile: current-compatible-2026-07-25
            numpy-version: "2.4.3"
            pandas-version: "3.0.5"
            duckdb-version: "1.5.5"
          - python-version: "3.12"
            dependency-profile: current-compatible-2026-07-25
            numpy-version: "2.4.3"
            pandas-version: "3.0.5"
            duckdb-version: "1.5.5"
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install reviewed engine versions
        run: |
          uv sync --locked --extra dev --extra duckdb --no-editable --python "${{ matrix.python-version }}"
          uv pip install --only-binary=:all: "numpy==${{ matrix.numpy-version }}" "pandas==${{ matrix.pandas-version }}" "duckdb==${{ matrix.duckdb-version }}"

      - name: Verify resolved engine versions
        env:
          EXPECTED_NUMPY: ${{ matrix.numpy-version }}
          EXPECTED_PANDAS: ${{ matrix.pandas-version }}
          EXPECTED_DUCKDB: ${{ matrix.duckdb-version }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import platform
          from importlib.metadata import version

          resolved = {"numpy": version("numpy"), "pandas": version("pandas"), "duckdb": version("duckdb")}
          expected = {
              "numpy": os.environ["EXPECTED_NUMPY"],
              "pandas": os.environ["EXPECTED_PANDAS"],
              "duckdb": os.environ["EXPECTED_DUCKDB"],
          }
          if resolved != expected:
              raise SystemExit(f"Resolved engine versions drifted: expected={expected!r} resolved={resolved!r}")
          print({"python": platform.python_version(), **resolved})
          PY

      - name: Run no-skip engine parity contract
        shell: bash
        run: |
          set -o pipefail
          uv run --no-sync python -m pytest \
            tests/test_engine_signature.py \
            tests/test_generator_benchmark_engines.py \
            tests/test_matching_properties.py \
            tests/test_matching_ambiguity.py \
            tests/test_golden_finance_datasets.py \
            | tee engine-parity-results.txt
          if grep -Eq '[0-9]+ skipped' engine-parity-results.txt; then
            echo 'Engine parity contract must not skip any selected test.' >&2
            exit 1
          fi

  docker-parity:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Validate container build and run
        run: |
          docker --version
          docker build -t reconforge:ci-baseline .
          docker run --rm reconforge:ci-baseline reconforge doctor
          docker run --rm reconforge:ci-baseline reconforge validate examples/sample_data
          docker run --rm reconforge:ci-baseline reconforge rules validate --pack control-packs/audit-basic

  server-boundaries:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked server dependencies
        run: uv sync --locked --extra dev --extra server --extra backup --no-editable --python 3.12

      - name: Create non-privileged PostgreSQL application role
        env:
          PGPASSWORD: postgres
        run: |
          psql --host localhost --username postgres --dbname postgres --command "CREATE ROLE reconforge_app LOGIN PASSWORD 'reconforge_app'"

      - name: Run Alembic PostgreSQL migration
        working-directory: ${{ github.workspace }}
        env:
          RECONFORGE_POSTGRES_DSN: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run --no-sync alembic -c alembic.ini upgrade head

      - name: Run live server-boundary tests
        env:
          RECONFORGE_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          RECONFORGE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          RECONFORGE_TEST_POSTGRES_DSN: postgresql://reconforge_app:reconforge_app@localhost:5432/postgres
          RECONFORGE_TEST_POSTGRES_APP_USER: reconforge_app
          RECONFORGE_TEST_POSTGRES_SOURCE_SERVICE: reconforge_ci_source
          RECONFORGE_TEST_POSTGRES_MAINTENANCE_SERVICE: reconforge_ci_admin
          RECONFORGE_TEST_REDIS_URL: redis://localhost:6379/0
          PGSERVICEFILE: ${{ runner.temp }}/reconforge-pgservice.conf
        run: |
          printf '%s\n' \
            '[reconforge_ci_source]' \
            'host=localhost' \
            'port=5432' \
            'dbname=postgres' \
            'user=postgres' \
            'password=postgres' \
            '[reconforge_ci_admin]' \
            'host=localhost' \
            'port=5432' \
            'dbname=postgres' \
            'user=postgres' \
            'password=postgres' > "$PGSERVICEFILE"
          chmod 600 "$PGSERVICEFILE"
          mapfile -t parity_tests < <(uv run --no-sync python -c "import yaml; document = yaml.safe_load(open('docs/execution/POSTGRES_PARITY_INVENTORY.yaml', encoding='utf-8')); print(*dict.fromkeys(item['test'] for item in document['boundaries'] if item.get('test')), sep='\\n')")
          uv run --no-sync pytest "${parity_tests[@]}" tests/test_alembic_postgres.py tests/test_postgres_foundation.py tests/test_postgres_master_data.py tests/test_postgres_ledger.py tests/test_postgres_identity.py tests/test_postgres_evidence.py tests/test_postgres_reconciliation.py tests/test_api_server_identity.py tests/test_redis_foundation.py -q
