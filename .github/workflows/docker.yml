name: Docker

on:
  pull_request:
  push:
    branches: ["main", "master"]

concurrency:
  group: reconforge-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --pull --no-cache --platform linux/amd64 -t reconforge-erp .

      - name: Hardened container doctor
        run: >-
          docker run --rm --network=none --read-only --cap-drop=ALL
          --security-opt=no-new-privileges reconforge-erp reconforge doctor
