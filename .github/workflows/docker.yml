name: Docker

on:
  pull_request:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t reconforge-erp .

      - name: Container doctor
        run: docker run --rm -v "$PWD/output:/app/output" reconforge-erp reconforge doctor
