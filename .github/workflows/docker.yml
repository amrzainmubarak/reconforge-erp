name: Docker

on:
  pull_request:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t reconforge-erp .

      - name: Container doctor
        run: docker run --rm -v "$PWD/output:/app/output" reconforge-erp reconforge doctor
