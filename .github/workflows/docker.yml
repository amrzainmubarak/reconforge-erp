name: Docker

on:
  pull_request:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Build image
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if docker build -t reconforge-erp .; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Docker build failed after ${attempt} attempts."
              exit 1
            fi

            sleep_seconds=$((attempt * 20))
            echo "Docker build failed; retrying in ${sleep_seconds}s (attempt $((attempt + 1))/3)."
            sleep "${sleep_seconds}"
          done

      - name: Container doctor
        run: docker run --rm -v "$PWD/output:/app/output" reconforge-erp reconforge doctor
