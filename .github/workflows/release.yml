name: Signed Release Candidate

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: signed-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-attest-verify:
    name: Build, attest, and verify release candidate
    runs-on: ubuntu-24.04
    environment: release-candidate
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml
      SBOM_PREDICATE_TYPE: https://cyclonedx.org/bom
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      SYFT_VERSION: "1.51.0"
      SYFT_COMMIT: 2293641e3bd628a01bb37639318d62c0ebe89b39
      SYFT_LINUX_AMD64_SHA256: 2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f
      GRYPE_VERSION: "0.117.0"
      GRYPE_COMMIT: b5fa92bbcbef655497e3be840a2f718380e2cdd3
      GRYPE_LINUX_AMD64_SHA256: 38525dab1e06f162ebaa02f94d82d1f807076b011a44180cf2777edf1a7b9c26
    steps:
      - name: Check out the signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/release-build-requirements.txt

      - name: Enforce publication freeze while objective closure is active
        run: python .github/scripts/check_publish_freeze.py --decisions docs/execution/DECISIONS.md --decision-id D-485

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Verify immutable source and signed annotated tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          version="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v${version}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

          tag_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq .object.type)"
          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq .object.sha)"
          test "$tag_type" = "tag"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq .tag)" = "$GITHUB_REF_NAME"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq .object.type)" = "commit"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq .verification.verified)" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq .verification.reason)" = "valid"

          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          [[ "$source_date_epoch" =~ ^[0-9]+$ ]]
          printf 'RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch" >> "$GITHUB_ENV"

      - name: Validate closed supply-chain policy and current lock
        run: |
          python .github/scripts/validate_supply_chain_policy.py --project-root .
          uv lock --check

      - name: Install locked security tools
        run: uv sync --locked --extra dev --no-editable --python 3.11

      - name: Audit the hash-locked Python and server resolution
        run: >-
          python .github/scripts/run_locked_python_audit.py
          --project-root .
          --python-version "3.11"
          --execution-mode current

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive_path" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive_path" | sha256sum --check --strict
          tar --extract --gzip --file "$archive_path" --directory "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          test "$("$install_dir/gitleaks" version)" = "$GITLEAKS_VERSION"
          printf 'GITLEAKS_PATH=%s\n' "$install_dir/gitleaks" >> "$GITHUB_ENV"

      - name: Scan full Git history with redacted output
        run: >-
          "$GITLEAKS_PATH" git --config .gitleaks.toml --log-opts="--all"
          --redact=100 --no-banner --no-color --timeout 120 .

      - name: Scan checked-out tree with redacted output
        run: >-
          "$GITLEAKS_PATH" dir --config .gitleaks.toml
          --redact=100 --no-banner --no-color --timeout 120 .

      - name: Audit the npm lock
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/npm-audit.json"
          set +e
          npm --prefix apps/web audit --package-lock-only --audit-level=high --json > "$report"
          audit_exit=$?
          set -e
          python .github/scripts/validate_supply_chain_policy.py \
            --project-root . \
            --npm-audit-report "$report" \
            --npm-audit-exit-code "$audit_exit"

      - name: Install locked web dependencies for release verification
        run: npm --prefix apps/web ci

      - name: Typecheck web release source
        run: npm --prefix apps/web run typecheck

      - name: Run web release component tests
        run: npm --prefix apps/web run test:run

      - name: Build web release bundle
        run: npm --prefix apps/web run build

      - name: Install Chromium for release E2E verification
        run: npx --prefix apps/web playwright install --with-deps chromium

      - name: Run standard web release E2E verification
        env:
          RECONFORGE_WEB_PORT: "4173"
        run: npm --prefix apps/web run e2e

      - name: Install hash-locked release build tools
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r .github/release-build-requirements.txt

      - name: Build source, wheel, and sdist candidates
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir release
          git archive --format=tar.gz --prefix="reconforge-erp-${version}/" \
            --output="release/reconforge-erp-${version}-source.tar.gz" "$GITHUB_SHA"
          python -m build --no-isolation --outdir release
          python .github/scripts/normalize_sdist.py \
            --path "release/reconforge_erp-${version}.tar.gz" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Install the pinned container security scanners
        shell: bash
        run: |
          set -euo pipefail
          syft_archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          syft_archive_path="${RUNNER_TEMP}/${syft_archive}"
          syft_install_dir="${RUNNER_TEMP}/syft-bin"
          mkdir -p "$syft_install_dir"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 --retry 3 \
            --output "$syft_archive_path" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${syft_archive}"
          printf '%s  %s\n' "$SYFT_LINUX_AMD64_SHA256" "$syft_archive_path" | sha256sum --check --strict
          tar --extract --gzip --file "$syft_archive_path" --directory "$syft_install_dir" syft
          chmod 0755 "$syft_install_dir/syft"

          syft_version_json="$("$syft_install_dir/syft" version --output json)"
          SYFT_VERSION_JSON="$syft_version_json" python - <<'PY'
          import json
          import os

          actual = json.loads(os.environ["SYFT_VERSION_JSON"])
          expected = {
              "application": "syft",
              "gitCommit": os.environ["SYFT_COMMIT"],
              "platform": "linux/amd64",
              "version": os.environ["SYFT_VERSION"],
          }
          if any(actual.get(key) != value for key, value in expected.items()):
              raise SystemExit("pinned Syft binary identity mismatch")
          PY
          printf 'SYFT_PATH=%s\n' "$syft_install_dir/syft" >> "$GITHUB_ENV"

          grype_archive="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          grype_archive_path="${RUNNER_TEMP}/${grype_archive}"
          grype_install_dir="${RUNNER_TEMP}/grype-bin"
          mkdir -p "$grype_install_dir"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 --retry 3 \
            --output "$grype_archive_path" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/${grype_archive}"
          printf '%s  %s\n' "$GRYPE_LINUX_AMD64_SHA256" "$grype_archive_path" | sha256sum --check --strict
          tar --extract --gzip --file "$grype_archive_path" --directory "$grype_install_dir" grype
          chmod 0755 "$grype_install_dir/grype"

          grype_version_json="$("$grype_install_dir/grype" version -o json)"
          GRYPE_VERSION_JSON="$grype_version_json" python - <<'PY'
          import json
          import os

          actual = json.loads(os.environ["GRYPE_VERSION_JSON"])
          expected = {
              "application": "grype",
              "gitCommit": os.environ["GRYPE_COMMIT"],
              "platform": "linux/amd64",
              "version": os.environ["GRYPE_VERSION"],
          }
          if any(actual.get(key) != value for key, value in expected.items()):
              raise SystemExit("pinned Grype binary identity mismatch")
          PY
          printf 'GRYPE_PATH=%s\n' "$grype_install_dir/grype" >> "$GITHUB_ENV"

      - name: Build the local image subject without registry credentials
        shell: bash
        run: |
          set -euo pipefail
          local_image="${IMAGE_NAME}:candidate-${GITHUB_SHA}"
          docker build --pull --no-cache --platform linux/amd64 --tag "$local_image" .
          image_config_digest="$(docker image inspect --format '{{.Id}}' "$local_image")"
          [[ "$image_config_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'LOCAL_IMAGE=%s\n' "$local_image" >> "$GITHUB_ENV"
          printf 'IMAGE_CONFIG_DIGEST=%s\n' "$image_config_digest" >> "$GITHUB_ENV"

      - name: Generate exact-image SBOM and vulnerability inputs
        shell: bash
        run: |
          set -euo pipefail
          "$SYFT_PATH" scan "$LOCAL_IMAGE" \
            --source-name "$IMAGE_NAME" \
            --source-version "$RELEASE_VERSION" \
            --scope squashed \
            --output "syft-json=${RUNNER_TEMP}/image.syft.json" \
            --output "cyclonedx-json=${RUNNER_TEMP}/image-syft.raw.cdx.json"
          "$GRYPE_PATH" db update
          "$GRYPE_PATH" "sbom:${RUNNER_TEMP}/image.syft.json" \
            --vex docs/security/container-runtime.openvex.json \
            --output json \
            --file "${RUNNER_TEMP}/image.grype.json"

      - name: Build and enforce the local container security gate
        shell: bash
        run: >-
          python .github/scripts/validate_container_security.py
          --project-root .
          --syft-json "${RUNNER_TEMP}/image.syft.json"
          --grype-report "${RUNNER_TEMP}/image.grype.json"
          --grype-exit-code 0
          --image-config-digest "${IMAGE_CONFIG_DIGEST}"
          --output "${RUNNER_TEMP}/container-security-evidence.json"

      - name: Run hardened candidate image smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges \
            "$LOCAL_IMAGE" reconforge doctor

      - name: Preserve container security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-security-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/container-security-evidence.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Log in to the candidate image registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Push and verify the scanned image subject
        id: image
        shell: bash
        run: |
          set -euo pipefail
          docker push "$LOCAL_IMAGE"
          repository_subject="$(
            docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$LOCAL_IMAGE" \
              | grep -E "^${IMAGE_NAME}@sha256:[0-9a-f]{64}$" \
              | tail -n 1
          )"
          digest="${repository_subject#*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect --raw "${IMAGE_NAME}@${digest}" \
            > "${RUNNER_TEMP}/published-image-manifest.json"
          IMAGE_DIGEST="$digest" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "published-image-manifest.json"
          raw = path.read_bytes()
          if f"sha256:{hashlib.sha256(raw).hexdigest()}" != os.environ["IMAGE_DIGEST"]:
              raise SystemExit("published manifest bytes do not match the registry digest")
          manifest = json.loads(raw)
          config = manifest.get("config")
          if not isinstance(config, dict) or config.get("digest") != os.environ["IMAGE_CONFIG_DIGEST"]:
              raise SystemExit("published manifest is not bound to the scanned image configuration")
          PY
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Build and validate the release identity manifest
        run: >-
          python .github/scripts/build_release_manifest.py
          --project-root .
          --release-dir release
          --tag "${GITHUB_REF_NAME}"
          --source-revision "${GITHUB_SHA}"
          --source-date-epoch "${SOURCE_DATE_EPOCH}"
          --image-subject "${IMAGE_NAME}@${{ steps.image.outputs.digest }}"

      - name: Build per-artifact SBOMs from the scanned image inventory
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/build_release_sboms.py \
            --project-root . \
            --release-dir release \
            --image-sbom-input "${RUNNER_TEMP}/image-syft.raw.cdx.json" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --forbidden-path-prefix "$RUNNER_TEMP" \
            --forbidden-path-prefix "$GITHUB_WORKSPACE"

      - name: Attest source and Python release files
        id: attest-files
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            release/reconforge-erp-${{ env.RELEASE_VERSION }}-source.tar.gz
            release/reconforge_erp-${{ env.RELEASE_VERSION }}-py3-none-any.whl
            release/reconforge_erp-${{ env.RELEASE_VERSION }}.tar.gz
            release/release-manifest.v1.json
            release/SHA256SUMS
            release/reconforge-erp-${{ env.RELEASE_VERSION }}-source.cdx.json
            release/reconforge_erp-${{ env.RELEASE_VERSION }}-py3-none-any.cdx.json
            release/reconforge_erp-${{ env.RELEASE_VERSION }}-sdist.cdx.json
            release/reconforge-erp-${{ env.RELEASE_VERSION }}-image.cdx.json
            release/sbom-manifest.v1.json
            release/SBOM_SHA256SUMS
          create-storage-record: false

      - name: Attest the image manifest digest
        id: attest-image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the source archive SBOM
        id: attest-source-sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release/reconforge-erp-${{ env.RELEASE_VERSION }}-source.tar.gz
          sbom-path: release/reconforge-erp-${{ env.RELEASE_VERSION }}-source.cdx.json
          create-storage-record: false

      - name: Attest the wheel SBOM
        id: attest-wheel-sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release/reconforge_erp-${{ env.RELEASE_VERSION }}-py3-none-any.whl
          sbom-path: release/reconforge_erp-${{ env.RELEASE_VERSION }}-py3-none-any.cdx.json
          create-storage-record: false

      - name: Attest the sdist SBOM
        id: attest-sdist-sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release/reconforge_erp-${{ env.RELEASE_VERSION }}.tar.gz
          sbom-path: release/reconforge_erp-${{ env.RELEASE_VERSION }}-sdist.cdx.json
          create-storage-record: false

      - name: Attest the image SBOM
        id: attest-image-sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: release/reconforge-erp-${{ env.RELEASE_VERSION }}-image.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Preserve and independently verify provenance bundles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FILES_BUNDLE: ${{ steps.attest-files.outputs.bundle-path }}
          IMAGE_BUNDLE: ${{ steps.attest-image.outputs.bundle-path }}
          SOURCE_SBOM_BUNDLE: ${{ steps.attest-source-sbom.outputs.bundle-path }}
          WHEEL_SBOM_BUNDLE: ${{ steps.attest-wheel-sbom.outputs.bundle-path }}
          SDIST_SBOM_BUNDLE: ${{ steps.attest-sdist-sbom.outputs.bundle-path }}
          IMAGE_SBOM_BUNDLE: ${{ steps.attest-image-sbom.outputs.bundle-path }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          install -m 0644 -- "$FILES_BUNDLE" release/files-provenance.sigstore.json
          install -m 0644 -- "$IMAGE_BUNDLE" release/image-provenance.sigstore.json
          install -m 0644 -- "$SOURCE_SBOM_BUNDLE" release/source-sbom.sigstore.json
          install -m 0644 -- "$WHEEL_SBOM_BUNDLE" release/wheel-sbom.sigstore.json
          install -m 0644 -- "$SDIST_SBOM_BUNDLE" release/sdist-sbom.sigstore.json
          install -m 0644 -- "$IMAGE_SBOM_BUNDLE" release/image-sbom.sigstore.json
          (
            cd release
            sha256sum --check SHA256SUMS
            sha256sum --check SBOM_SHA256SUMS
          )

          verify_file_provenance() {
            gh attestation verify "release/$1" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --signer-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners \
              --bundle release/files-provenance.sigstore.json >/dev/null
          }
          while read -r _ artifact; do
            verify_file_provenance "$artifact"
          done < <(cat release/SHA256SUMS release/SBOM_SHA256SUMS)
          for artifact in SHA256SUMS SBOM_SHA256SUMS; do
            verify_file_provenance "$artifact"
          done

          gh attestation verify "oci://${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --signer-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --bundle release/image-provenance.sigstore.json >/dev/null

          gh attestation verify "release/reconforge-erp-${RELEASE_VERSION}-source.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --signer-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --predicate-type "$SBOM_PREDICATE_TYPE" \
            --bundle release/source-sbom.sigstore.json >/dev/null

          gh attestation verify "release/reconforge_erp-${RELEASE_VERSION}-py3-none-any.whl" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --signer-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --predicate-type "$SBOM_PREDICATE_TYPE" \
            --bundle release/wheel-sbom.sigstore.json >/dev/null

          gh attestation verify "release/reconforge_erp-${RELEASE_VERSION}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --signer-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --predicate-type "$SBOM_PREDICATE_TYPE" \
            --bundle release/sdist-sbom.sigstore.json >/dev/null

          gh attestation verify "oci://${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --signer-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --predicate-type "$SBOM_PREDICATE_TYPE" \
            --bundle release/image-sbom.sigstore.json >/dev/null

          sha256sum release/*sigstore.json > release/ATTESTATION_SHA256SUMS

      - name: Upload verified release candidate for human review
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-release-candidate-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: Record candidate storage digest
        run: |
          echo "candidate_artifact_id=${{ steps.upload.outputs.artifact-id }}"
          echo "candidate_storage_digest=${{ steps.upload.outputs.artifact-digest }}"
          echo "No GitHub Release or PyPI publication was performed."
