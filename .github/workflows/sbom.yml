name: SBOM

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  cyclonedx-python:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and SBOM tool
        run: |
          python -m pip install cyclonedx-bom
          python -m pip install -e .

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p sbom
          cyclonedx-py environment --spec-version 1.6 --output-format JSON --output-reproducible --output-file sbom/reconforge-erp.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reconforge-erp-cyclonedx-sbom
          path: sbom/reconforge-erp.cdx.json
          if-no-files-found: error
