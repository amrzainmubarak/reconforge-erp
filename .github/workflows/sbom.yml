name: SBOM

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  cyclonedx-python:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and SBOM tool
        run: |
          python -m pip install cyclonedx-bom
          python -m pip install -e .

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p sbom
          cyclonedx-py environment --spec-version 1.6 --output-format JSON --output-reproducible --output-file sbom/reconforge-erp.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reconforge-erp-cyclonedx-sbom
          path: sbom/reconforge-erp.cdx.json
          if-no-files-found: error
