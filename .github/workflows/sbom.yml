name: SBOM

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  cyclonedx-python:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and SBOM tool
        run: |
          python -m pip install --require-hashes -r requirements-sbom.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p sbom
          cyclonedx-py environment --spec-version 1.6 --output-format JSON --output-reproducible --output-file sbom/reconforge-erp.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reconforge-erp-cyclonedx-sbom
          path: sbom/reconforge-erp.cdx.json
          if-no-files-found: error
