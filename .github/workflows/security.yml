name: Security

on:
  pull_request:
  push:
    branches: ["main", "master"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    name: Locked Python audit (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Validate policy and current universal lock
        run: |
          python .github/scripts/validate_supply_chain_policy.py --project-root .
          uv lock --check

      - name: Install locked runtime and security tools
        run: uv sync --locked --extra dev --no-editable --python "${{ matrix.python-version }}"

      - name: Bandit
        run: uv run --no-sync bandit -q -r reconforge

      - name: Audit the hash-locked Python and server resolution
        run: >-
          python .github/scripts/run_locked_python_audit.py
          --project-root .
          --python-version "${{ matrix.python-version }}"
          --execution-mode current

  repository-security:
    name: Secret and npm policy gates
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Validate closed policy and exception registry
        run: python .github/scripts/validate_supply_chain_policy.py --project-root .

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive_path" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive_path" | sha256sum --check --strict
          tar --extract --gzip --file "$archive_path" --directory "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          test "$("$install_dir/gitleaks" version)" = "$GITLEAKS_VERSION"
          printf 'GITLEAKS_PATH=%s\n' "$install_dir/gitleaks" >> "$GITHUB_ENV"

      - name: Scan full Git history with redacted output
        run: >-
          "$GITLEAKS_PATH" git --config .gitleaks.toml --log-opts="--all"
          --redact=100 --no-banner --no-color --timeout 120 .

      - name: Scan checked-out tree with redacted output
        run: >-
          "$GITLEAKS_PATH" dir --config .gitleaks.toml
          --redact=100 --no-banner --no-color --timeout 120 .

      - name: Audit the npm lock
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/npm-audit.json"
          set +e
          npm --prefix apps/web audit --package-lock-only --audit-level=high --json > "$report"
          audit_exit=$?
          set -e
          python .github/scripts/validate_supply_chain_policy.py \
            --project-root . \
            --npm-audit-report "$report" \
            --npm-audit-exit-code "$audit_exit"

  container-security:
    name: Exact-image SBOM, vulnerability, and license gate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      IMAGE_NAME: ghcr.io/amrzainmubarak/reconforge-erp
      SYFT_VERSION: "1.51.0"
      SYFT_COMMIT: 2293641e3bd628a01bb37639318d62c0ebe89b39
      SYFT_LINUX_AMD64_SHA256: 2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f
      GRYPE_VERSION: "0.117.0"
      GRYPE_COMMIT: b5fa92bbcbef655497e3be840a2f718380e2cdd3
      GRYPE_LINUX_AMD64_SHA256: 38525dab1e06f162ebaa02f94d82d1f807076b011a44180cf2777edf1a7b9c26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Validate the closed scanner policy
        run: python .github/scripts/validate_supply_chain_policy.py --project-root .

      - name: Install checksum-verified Syft and Grype
        shell: bash
        run: |
          set -euo pipefail
          install_scanner() {
            local tool="$1"
            local version="$2"
            local checksum="$3"
            local archive="${tool}_${version}_linux_amd64.tar.gz"
            local archive_path="${RUNNER_TEMP}/${archive}"
            local install_dir="${RUNNER_TEMP}/${tool}-bin"
            mkdir -p "$install_dir"
            curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 --retry 3 \
              --output "$archive_path" \
              "https://github.com/anchore/${tool}/releases/download/v${version}/${archive}"
            printf '%s  %s\n' "$checksum" "$archive_path" | sha256sum --check --strict
            tar --extract --gzip --file "$archive_path" --directory "$install_dir" "$tool"
            chmod 0755 "$install_dir/$tool"
          }
          install_scanner syft "$SYFT_VERSION" "$SYFT_LINUX_AMD64_SHA256"
          install_scanner grype "$GRYPE_VERSION" "$GRYPE_LINUX_AMD64_SHA256"

          syft_version_json="$("${RUNNER_TEMP}/syft-bin/syft" version --output json)"
          grype_version_json="$("${RUNNER_TEMP}/grype-bin/grype" version -o json)"
          SYFT_VERSION_JSON="$syft_version_json" GRYPE_VERSION_JSON="$grype_version_json" python - <<'PY'
          import json
          import os

          expected = {
              "syft": (os.environ["SYFT_VERSION"], os.environ["SYFT_COMMIT"]),
              "grype": (os.environ["GRYPE_VERSION"], os.environ["GRYPE_COMMIT"]),
          }
          for tool, variable in (("syft", "SYFT_VERSION_JSON"), ("grype", "GRYPE_VERSION_JSON")):
              actual = json.loads(os.environ[variable])
              version, commit = expected[tool]
              if (
                  actual.get("application") != tool
                  or actual.get("version") != version
                  or actual.get("gitCommit") != commit
                  or actual.get("platform") != "linux/amd64"
              ):
                  raise SystemExit(f"pinned {tool} binary identity mismatch")
          PY
          printf 'SYFT_PATH=%s\n' "${RUNNER_TEMP}/syft-bin/syft" >> "$GITHUB_ENV"
          printf 'GRYPE_PATH=%s\n' "${RUNNER_TEMP}/grype-bin/grype" >> "$GITHUB_ENV"

      - name: Build and scan the exact local image
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          local_image="reconforge-security:${GITHUB_SHA}"
          docker build --pull --no-cache --platform linux/amd64 --tag "$local_image" .
          image_config_digest="$(docker image inspect --format '{{.Id}}' "$local_image")"
          [[ "$image_config_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          "$SYFT_PATH" scan "$local_image" \
            --source-name "$IMAGE_NAME" \
            --source-version "$version" \
            --scope squashed \
            --output "syft-json=${RUNNER_TEMP}/image.syft.json"
          "$GRYPE_PATH" db update
          "$GRYPE_PATH" "sbom:${RUNNER_TEMP}/image.syft.json" \
            --output json \
            --file "${RUNNER_TEMP}/image.grype.json"
          printf 'IMAGE_CONFIG_DIGEST=%s\n' "$image_config_digest" >> "$GITHUB_ENV"

      - name: Enforce fail-closed container policy
        run: >-
          python .github/scripts/validate_container_security.py
          --project-root .
          --syft-json "${RUNNER_TEMP}/image.syft.json"
          --grype-report "${RUNNER_TEMP}/image.grype.json"
          --grype-exit-code 0
          --image-config-digest "${IMAGE_CONFIG_DIGEST}"
          --output "${RUNNER_TEMP}/container-security-evidence.json"

      - name: Preserve recurring scan evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recurring-container-security-${{ github.sha }}
          path: ${{ runner.temp }}/container-security-evidence.json
          if-no-files-found: ignore
          retention-days: 14

  required-security-context:
    name: python-security
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs: [python-security, repository-security, container-security]
    permissions: {}
    steps:
      - name: Require every security job to pass
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.python-security.result }}' = 'success'
          test '${{ needs.repository-security.result }}' = 'success'
          if [[ '${{ github.event_name }}' = 'schedule' || '${{ github.event_name }}' = 'workflow_dispatch' ]]; then
            test '${{ needs.container-security.result }}' = 'success'
          else
            test '${{ needs.container-security.result }}' = 'skipped'
          fi
