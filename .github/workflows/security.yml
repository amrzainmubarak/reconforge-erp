name: Security

on:
  pull_request:
  push:
    branches: ["main", "master"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    name: Locked Python audit (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Validate policy and current universal lock
        run: |
          python .github/scripts/validate_supply_chain_policy.py --project-root .
          uv lock --check

      - name: Install locked runtime and security tools
        run: uv sync --locked --extra dev --no-editable --python "${{ matrix.python-version }}"

      - name: Bandit
        run: uv run --no-sync bandit -q -r reconforge

      - name: Audit the hash-locked Python and server resolution
        shell: bash
        run: |
          set -euo pipefail
          requirements="${RUNNER_TEMP}/reconforge-all-extras-${{ matrix.python-version }}.txt"
          report="${RUNNER_TEMP}/pip-audit-${{ matrix.python-version }}.json"
          uv export --locked --all-extras --no-emit-project \
            --format requirements.txt --quiet --output-file "$requirements"
          set +e
          uv run --no-sync pip-audit --require-hashes --disable-pip \
            --requirement "$requirements" --format json --output "$report"
          audit_exit=$?
          set -e
          python .github/scripts/validate_supply_chain_policy.py \
            --project-root . \
            --pip-audit-report "$report" \
            --pip-audit-exit-code "$audit_exit"

  repository-security:
    name: Secret and npm policy gates
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Validate closed policy and exception registry
        run: python .github/scripts/validate_supply_chain_policy.py --project-root .

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive_path" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive_path" | sha256sum --check --strict
          tar --extract --gzip --file "$archive_path" --directory "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          test "$("$install_dir/gitleaks" version)" = "$GITLEAKS_VERSION"
          printf 'GITLEAKS_PATH=%s\n' "$install_dir/gitleaks" >> "$GITHUB_ENV"

      - name: Scan full Git history with redacted output
        run: >-
          "$GITLEAKS_PATH" git --config .gitleaks.toml --log-opts="--all"
          --redact=100 --no-banner --no-color --timeout 120 .

      - name: Scan checked-out tree with redacted output
        run: >-
          "$GITLEAKS_PATH" dir --config .gitleaks.toml
          --redact=100 --no-banner --no-color --timeout 120 .

      - name: Audit the npm lock
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/npm-audit.json"
          set +e
          npm --prefix apps/web audit --package-lock-only --audit-level=high --json > "$report"
          audit_exit=$?
          set -e
          python .github/scripts/validate_supply_chain_policy.py \
            --project-root . \
            --npm-audit-report "$report" \
            --npm-audit-exit-code "$audit_exit"
