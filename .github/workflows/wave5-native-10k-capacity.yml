name: Wave5 bounded native 10K financial capacity

on:
  push:
    branches: [amr/wave5-native-10k-capacity-20261012]

permissions:
  contents: read

concurrency:
  group: wave5-native-10k-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-10k-capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Record original workflow subject before checkout
        run: |
          mkdir -p "$RUNNER_TEMP/wave5-native-10k"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/wave5-native-10k/workflow-source-commit.txt"

      - name: Check out immutable controller source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Check out actual accepted current22 runtime
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: 22ebfd78e293aafa13d81b3a0bbf287491951115
          path: current
          fetch-depth: 0
          persist-credentials: false

      - name: Set up supported Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
        with:
          version: '0.11.32'

      - name: Install locked isolated controller dependencies
        working-directory: control
        run: uv sync --locked --all-extras --no-editable

      - name: Verify controller and independent financial contracts
        working-directory: control
        run: |
          uv run --no-sync ruff check .github/scripts/benchmark_wave5_profile_diagnostics.py .github/scripts/verify_wave5_large_journal.py tests/test_wave5_profile_diagnostics.py tests/test_wave5_large_journal_oracle.py
          uv run --no-sync pytest tests/test_wave5_profile_diagnostics.py tests/test_wave5_large_journal_oracle.py -q --junitxml="$RUNNER_TEMP/wave5-native-10k/pure-contracts.xml"

      - name: Run one real current22 10K native population
        working-directory: control
        # Same native three-human harness and PostgreSQL17.11 pin. Harness has
        # its original7200-second ceiling; outer capacity admission7500seconds,
        # owned child7800seconds, total8400seconds with120seconds cleanup reserve.
        # This is single-source capacity, not a baseline/candidate speed claim.
        run: >-
          uv run --no-sync python .github/scripts/benchmark_wave5_profile_diagnostics.py
          --current-root ../current
          --current-capacity-entries 10000
          --output "$RUNNER_TEMP/wave5-native-10k/capacity"

      - name: Retain all original positive and negative capacity records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wave5-native-10k-${{ github.sha }}
          path: ${{ runner.temp }}/wave5-native-10k
          if-no-files-found: error
          retention-days: 30
