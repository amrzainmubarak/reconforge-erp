      - E-222 replaces hand-entered drill snapshots with bounded operational sources without claiming task exit. A capacity-bounded concurrent HTTP window records real FastAPI responses and computes exact integer error basis points and nearest-rank p95. The SQLite collector reads aggregate queued/retrying depth and oldest age, verifies the actual append-only audit chain, executes explicit dependency probes, and measures process resident memory through standard platform APIs; source or schema failure omits affected metrics and emits a safe source category so alert evaluation becomes no_data. The revised drill creates and migrates a real temporary database, exercises real HTTP/audit/job sources, drives two dependency failures and capacity critical state, then verifies recovery. The `ops reliability` CLI exposes only aggregate policy state and can fail closed with `--require-complete`. Twenty-four focused tests pass. PostgreSQL/source parity, external collector and alert delivery, repeated capacity/load evidence, independent-host HA, and production SLOs remain open.
      - E-223 exercises explicit vendor-neutral OTLP/HTTP protobuf delivery without claiming task exit. The official 1.44.0 exporter is pinned with its five locked transitive packages. API startup creates no exporter by default; an explicit path-free origin, loopback-only plaintext or exact HTTPS host allowlist, bounded timeout/interval, existing CA files, and paired mTLS files are required. Export sessions ignore ambient proxies and accept no header credentials. A real FastAPI health request delivered safe traces, metrics, and a schema-closed operational event to a local HTTP receiver at the three standard v1 paths, force-flushed, and shut down cleanly; arbitrary log messages and hostile endpoint/proxy inputs are rejected. This is not a full Collector distribution, alert manager, general application-log export, PostgreSQL parity, independent-host HA, or production SLO evidence.
      - E-224 verifies PostgreSQL source parity without claiming task exit. A reproducible Docker drill migrates a fresh PostgreSQL 17.10 database to 0053, creates a non-superuser application role, and runs the live collector through forced-RLS tenant transactions. Two queued jobs in sibling tenants prove exact one-row depth and 600-second oldest age for the selected tenant, sibling exclusion, and tenant-scoped audit verification. The digest-pinned image, Docker version, migration head, test result, and cleanup are retained in a closed report. This remains a synthetic single-node result without repeated load/capacity, alert delivery, independent-host HA, or production SLO evidence.
      - E-225 adds one environment-bound capacity/backlog exercise without claiming task exit. On Windows 11, Python 3.12.13, and 16 logical CPUs, 1,000 in-process FastAPI health requests completed with zero server-error basis points, 16 ms observed p95, 10,460 ms aggregate wall time, and 130 MiB observed resident memory. A 1,000-job SQLite backlog crossed the exact critical threshold; the aggregate query measured below the one-millisecond report resolution and returned to normal/zero age after synthetic disposable recovery. This is one in-process/local run, not a network load, soak, distributed-capacity, production SLO, or sizing claim.
      - E-226 verifies an official Collector distribution and backend without claiming task exit. Digest-pinned OpenTelemetry Collector Contrib 0.153.0 ran read-only with all capabilities dropped, no-new-privileges, loopback-only OTLP publication, and the repository's three-pipeline config. A real API request, queue metric, critical alert event, RF-OPS-002 binding, and telemetry policy persisted to a 5,426-byte ephemeral file artifact whose SHA-256 is retained; prohibited sensitive marker names were absent and cleanup passed. Durable backend retention, independent alert-manager acknowledgement, multi-node Collector HA, and production SLO evidence remain open.
      - E-227 adds an ordered tamper-evident incident lifecycle without claiming task exit. A real 1,000-job SQLite aggregate triggered the critical job-backlog policy and RF-OPS-002. The closed exercise recorded detection, synthetic acknowledgement, mitigation, all-signal-normal recovery by a distinct validator reference, and closure in 60 synthetic seconds. Events use safe codes and SHA-256 evidence references, commit to the prior event, and form a verified deterministic manifest. This is not external pager acknowledgement, real staffing separation, durable incident retention, repeated production exercise, independent-host HA, or external assurance.
