      - E-287 adds an injected provider transport boundary for governed write-back. Approved/dispatched intents pass only identity, operation, idempotency key, and payload digest; provider acknowledgements must bind the original key, while transport failures and mismatches fail closed. Synthetic success, replay/mismatch, self-approval, and failure-injection contracts pass under ADR 0240. No network I/O, live provider, credential provisioning, or posting claim is introduced.
