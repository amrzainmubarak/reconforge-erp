      - E-260 adds a dedicated regression/evidence slice over the existing persistence-independent grouped matcher in `reconforge/domain/grouped_matching.py` and `reconforge/application/grouped_matching.py`. Exact Decimal records support one-to-many, many-to-one, and true many-to-many/netting groups, sourced FX conversion, explicit fee accounting, date/partition bounds, permutation-stable digests, visible unmatched outcomes, equal-optimum ambiguity, and explicit search budgets. Seventeen focused contracts and package membership pass under ADR 0215. Multiple non-overlapping groups, partial settlement allocation, carry-forward/sequence strategies, mutation tests, crash/resume integration, cross-engine parity, and 10K/100K/1M benchmarks remain open.
      - E-261 adds explicit `partial-settlement` mode to the same grouped domain/application/strategy surface. Positive bounded group totals can produce a replayable proposal that settles the smaller side and exposes `settled_amount`, `left_residual`, and `right_residual`; exact equality wins before partial candidates, while partition/date/cardinality/search limits and ambiguity remain fail-closed. Focused domain/application/strategy/rule/schema contracts pass under ADR 0216. Multiple non-overlapping groups, carry-forward/sequence/reversal strategies, mutation tests, crash/resume integration, cross-engine parity, and 10K/100K/1M benchmarks remain open.
      - E-262 adds `portfolio` mode without changing the single-group compatibility API. Bounded exact candidates are selected as a non-overlapping maximum-cover set with aggregate-difference minimization; unmatched IDs remain explicit, permutation digests are stable, and equal portfolios or exhausted generation/selection budgets stay ambiguous. The application service, runtime manifest, Reconciliation-as-Code model, schema, published strategy document, and focused contracts are aligned under ADR 0217. Partial groups inside portfolios, carry-forward/sequence/reversal strategies, mutation/crash-resume integration, cross-engine parity, and 10K/100K/1M benchmarks remain open.
      - E-263 adds `bounded-carry-forward-fifo` as an experimental sequence/window strategy. One currency/partition is processed with exact Decimal FIFO allocation, visible obligation/settlement residuals, permutation-stable decision digests, and explicit ambiguity on search/allocation ceilings. Strategy manifest, published architecture contract, ADR 0218, domain tests, and strategy tests are aligned. Reversal-specific logic, crash/resume, cross-engine parity, and large benchmarks remain open.
      - E-264 adds `bounded-reversal-pairing` as an experimental opposite-sign strategy. It prefers explicit reversal links, otherwise uses bounded amount/date candidates within one currency/partition; each original is consumed once, equal candidates and search ceilings remain ambiguous, and unmatched IDs are explicit. Manifest, architecture contract, ADR 0219, domain tests, and strategy tests are aligned. Posting, compensation, crash/resume, cross-engine parity, and scale benchmarks remain open.
      - E-265 adds explicit partial groups inside `portfolio`. `allow_partial_settlement` is disabled by default and binds into the request/policy digest; when enabled, exact groups remain eligible, unequal positive groups expose settled amount and residuals, and non-overlap/budget/ambiguity rules remain fail-closed. Domain/application/strategy contracts, ADR 0220, and focused tests pass. Mutation/crash-resume, cross-engine parity, and 10K/100K/1M benchmarks remain open.
