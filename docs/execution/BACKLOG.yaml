      - E-168 adds real signed SAML 2.0 Response verification through locked python3-saml 1.16.0, xmlsec 1.3.17 and lxml 6.1.1 rather than custom XML Signature. Fixed per-provider IdP certificates and credential-free HTTPS endpoints feed strict validation requiring a signed Response, exactly one Assertion, expected destination/recipient/InResponseTo, issuer, audience, NameID and bounded conditions. The adapter independently allowlists SignatureMethod and DigestMethod and normalizes bounded attributes only after xmlsec validation. Six tests generate a synthetic RSA-2048 X.509 certificate, sign real XML, and cover success, signed wrong issuer/audience/request, post-signature tamper, wrong certificate, request correlation and unsafe endpoints. The 28-test Federation/OIDC/SAML target passes and pip-audit reports no known vulnerabilities. The library emits an internal utcnow deprecation warning; upgrade monitoring remains. Durable PostgreSQL replay/link/session storage, logout and routes remain, so P3-ENT-001 stays in progress.
