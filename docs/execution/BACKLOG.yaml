      - E-275 publishes the first matching-specific 10K tier: 2,500 independent true many-to-many partitions with four records each. Every partition runs through the public strategy adapter and application service; reversed-order samples prove permutation stability. Two Windows 11/Python 3.14.6 runs match all 2,500 partitions with zero ambiguity/unmatched results, zero cross-engine/permutation mismatches, and identical effect/manifest digests. FX/fee/partial-settlement density, PostgreSQL runtime parity, and 100K/1M tiers remain unverified.
      - E-276 publishes the matching-specific 100K tier: 25,000 independent true many-to-many partitions with four records each. Two Windows 11/Python 3.14.6 runs match all 25,000 partitions with zero ambiguity/unmatched results, zero cross-engine/permutation mismatches, and identical effect/manifest digests. The observed runtimes were 42.0286s and 40.7803s with 7.7915/7.7700 MiB peak traced memory. FX/fee/partial-settlement density, PostgreSQL runtime parity, distributed capacity, and 1M remain unverified.
      - E-277 publishes the matching-specific 1M tier: 250,000 independent true many-to-many partitions with four records each. Two Windows 11/Python 3.14.6 runs match all 250,000 partitions with zero ambiguity/unmatched results, zero cross-engine/permutation mismatches, and identical effect/manifest digests. The observed runtimes were 433.3014s and 427.1993s with 77.5718/77.5585 MiB peak traced memory. PostgreSQL runtime parity, soak, distributed capacity, and domain-diverse workloads remain unverified.
      - E-288 adds a bounded request-level mutation campaign for grouped matching. Three critical mutants (one-cent amount increase, one-cent decrease, and disabling partial settlement) are each compared with their own baseline through the public strategy/application boundary; 3/3 are killed with zero survivors. This is a targeted financial sentinel, not a source-code mutation score; PostgreSQL runtime, fuzzing, and mutation coverage outside these cases remain open.
