  - id: P4-IAM-001
    priority: P4
    area: enterprise_policy
    goal_workstream: enterprise_identity_and_policy
    title: Complex enterprise authorization and policy administration
    status: in_progress
    depends_on: [P1-PLAT-008, P3-ENT-001, P3-ENT-002, P3-ENT-003, P3-ENT-006]
    exit_evidence: Central versioned RBAC/ABAC covers entity, period, amount, region, data class, delegation, emergency authority, service identity, field restrictions, policy approval, cache invalidation, conflict analysis, tenant isolation, and no self-approval across API/jobs/exports/UI.
    completed_slices:
      - E-285 extends `central-policy-v1` with exact finite Decimal amount floors/ceilings plus region and data-classification scopes. Missing scope grants deny by default; invalid numeric bounds fail before evaluation; existing callers remain compatible. Focused policy and Hypothesis suites pass under ADR 0238. Route/job/export/UI attribute coverage, policy administration/cache invalidation, OIDC/SAML/SCIM, and PostgreSQL RLS remain open.
      - E-292 adds explicit, timezone-aware expiring delegation to the central policy context. Evaluation time is supplied by the caller for deterministic replay; missing evaluation time and at/after-expiry requests deny by stable reason codes. The helper forwards the fields and focused/Hypothesis policy gates remain green. Delegation administration storage, provider federation, route/job/export/UI coverage, and PostgreSQL RLS remain open.
      - E-293 adds migration 27 and a typed tenant/workspace-scoped SQLite delegation repository. Grant fields are immutable, only independent active-to-revoked transitions are allowed, and effective reads require an explicit timezone-aware instant. Local synthetic tests pass; federation, PostgreSQL/RLS, route/job/export/UI enforcement, cache invalidation, and emergency access remain open.
      - E-297 adds an opt-in governed durable-job application boundary. Submit/cancel require a matching actor identity, central permission, tenant/workspace scope, and centralized SoD evaluation before the existing lifecycle repository is touched; denied requests are tested as no-effect. Route migration, federation, and cache invalidation remain open.
      - E-298 runs the governed wrapper against the PostgreSQL durable-job repository in the live server-boundaries job. A denied permission produces no row, an allowed scoped submit produces one tenant-bound row, and sibling-tenant lookup remains empty under the non-privileged role. The wrapper remains opt-in and is not a claim that every surface is migrated.
      - E-301 adds an opt-in bounded `PolicyDecisionCache`. Cache keys include every policy context attribute and policy version; denials and delegated decisions bypass storage; explicit tenant/workspace/global invalidation is tested without sibling-tenant eviction. No API or mutation path adopts caching implicitly, so route migration and invalidation wiring remain open.
      - E-302 adds migration 0056 and `PostgresDelegationRepository` with exact typed grant conversion, tenant/workspace scope validation, explicit evaluation instants, forced RLS, and database-enforced append-only revocation. Focused schema/migration/repository contracts and CI server-boundaries run 30771736208 pass the live PostgreSQL create/effective-read/revoke/isolation gate under ADR 0253; federation, route coverage, and cache invalidation wiring remain open.
      - E-303 adds explicit `policy_cache_enabled` API configuration, cache-backed all/any permission dependencies, and global invalidation after every non-safe HTTP request. Focused cache/API compatibility tests pass under ADR 0254; distributed invalidation and route-specific scope optimization remain open.
      - E-305 adds explicit field-level authorization inputs to the central policy helper and a deterministic `project_fields` primitive. Unauthorized fields deny; authorized masked fields become `[REDACTED]` with digest evidence. Complete route/action/UI migration remains open.
      - E-321 adds a startup fail-closed validator over the closed API route inventory. Every mutating route must be permission-bearing or dynamic unless it is in an explicit authentication/WebAuthn/step-up handshake allowlist; SCIM remains separately classified. Existing route count/digest stay unchanged. Federation, policy administration, distributed invalidation, and jobs/exports/UI coverage remain open under ADR 0272.
      - E-328 adds `enterprise-policy-conflict-analysis-v1`, a pure read-only analyzer over approved tenant-bound policy grants. It canonically detects overlapping prepare/review/submit/approve permissions, human-governed permissions held by service accounts, unscoped privileged grants when required by policy, and duplicate active grants. Findings are maker-checker attributed, severity/digest bound, replay-verifiable, and exposed through `reconforge policy analyze-conflicts` using bounded structured ingress; enforcement, provider-backed administration, distributed invalidation, and complete route/job/export/UI adoption remain open.
      - E-329 adds `PolicyAnalysisApplicationService` and a tenant-RLS PostgreSQL snapshot adapter. `POST /api/v1/admin/access/policy-analysis` requires the human-only `security.policy.manage` permission, an independent approved actor/timestamp, and returns the same replay-verifiable analysis without mutating roles, sessions, or policy state. Active PostgreSQL user-role permissions and enabled service-account permissions are loaded with tenant predicates; CI server-boundaries run `30803066835` passes the bounded single-node synthetic runtime gate and promotes this adapter to `live_verified_current`. Federation, scoped entity/period persistence, distributed invalidation, and complete route/job/export/UI adoption remain open.
      - E-330 adds Alembic `0058_pg_policy_permission_scopes` and a forced-RLS, append-only `identity_role_permission_scopes` table for workspace/entity/period/region/data-classification bounds. The policy snapshot adapter groups permissions by identical persisted scope and keeps tenant-wide grants explicit when no scope exists. CI server-boundaries run `30805942878` passes migration, RLS, scope projection, tamper/delete refusal, and valid revocation, promoting this bounded adapter to `live_verified_current`.
      - E-331 adds Alembic `0059_pg_policy_amt_bounds` with finite exact Decimal minimum/maximum bounds, inclusive interval overlap, append-only immutability, widened uniqueness, and data-loss-refusing downgrade. Local focused/full tests and CI server-boundaries run `30808822315` pass the migration, RLS, projection, tamper, revocation, parity, security, and packaging gates. Currency conversion, federation, distributed invalidation, and complete route/job/export/UI enforcement remain open.

