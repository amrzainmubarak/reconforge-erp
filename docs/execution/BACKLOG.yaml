      - E-337 extends the live worker contract with a `portfolio` run using `netting_mode=net`, explicit Decimal fees, and `allow_partial_settlement=true`. The synthetic run proves a partial proposal (`120 - 20` net against `80`) with a visible `20` residual plus an exact `50`/`50` portfolio match; persisted fee/net/residual lineage and the portfolio result digest equal the direct strategy output. Settlement posting, provider acknowledgement, scale/soak/backpressure, distributed capacity, HA/DR, and statutory accounting treatment remain open.
      - E-340 adds `PostgresSequentialMatchingAdapter` for explicit `carry-forward`, `sequence-window`, and `reversal-pairing` worker modes. CI server-boundaries run `30825258020` proves carry-forward residuals, explicit reversal links, unmatched records, ambiguity exceptions, and strategy digest parity through the existing result schema. Posting, write-back, large-scale sequence performance, HA/DR, and production readiness remain open.

