      - E-299 adds `reference-erp-readonly`, an entity-scoped ERP ledger-line connector over the governed HTTPS runtime. Its exact Decimal page schema rejects non-finite amounts, duplicate IDs, and mixed-entity pages; cursor/idempotency, canonical response digests, secret-reference isolation, endpoint allowlisting, and failure schemas are covered by focused tests. It is a provider-neutral synthetic reference, not a live ERP integration or write-back capability.
      - E-306 adds migration 28 and `SQLiteWritebackIntentRepository`. Intent versions are append-only, scope-filtered, digest-bound, idempotent, optimistic-concurrency checked, and transition-limited; delete/update triggers fail closed. The repository stores no payload or secret and does not dispatch network calls. Live provider interoperability remains open.
      - E-307 adds `POST /api/v1/connectors/writeback/intents` as a proposal-only local API boundary. Dedicated permission and authenticated actor binding are enforced; identical requests return the same version/digest, while network dispatch is explicitly disabled.
      - E-308 adds `POST /api/v1/connectors/writeback/intents/{intent_id}/approve` with a separate approval permission and migration 29. Distinct maker/checker identity, tenant/workspace scope, lifecycle validation, and optimistic versioning are enforced; provider dispatch remains disabled.
      - E-309 adds `POST /api/v1/connectors/writeback/intents/{intent_id}/acknowledge` with migration 30 and a separate reconciliation permission. It reconciles only an already-dispatched local intent, binds provider reference/response digest to the original idempotency key, and keeps network dispatch disabled.
      - E-310 adds permissioned local read-only drill-down endpoints under `/api/v1/consolidation-close`. Workspace-scoped periods, runs, journal/effect details, and summaries are replay-verified before response; tampered worksheets and unknown workspaces fail closed.
      - E-311 hardens the live PostgreSQL consolidation-close adapter: conflicting replays fail closed, JSONB worksheets and journal digests are replay-verified on reads, and period lock/reopen events retain reasons and enforce independent actors.
      - E-315 adds posted-close certification to the local consolidation lifecycle. Certification is available only for `Posted`/`Reversed` runs, persists through the existing immutable certification record, requires distinct approval permissions and actors, and is exposed through authenticated prepare/review/read API routes with replay validation.
      - E-316 promotes posted-run certification to the PostgreSQL consolidation adapter. The tenant-scoped repository now replay-validates the JSONB worksheet, locks the run state, and delegates to the existing RLS certification record with independent review; the live contract grants only the required certification table access and exercises prepare/review/read.
      - E-314 adds `verify_network_retry_failure_injection`, a reusable synthetic transport gate for bounded transient retry, successful recovery, and response-body isolation. Focused connector tests cover retryable status validation and retry-ceiling refusal; no provider or network claim is introduced.
      - E-343 adds Alembic `0061_pg_writeback_intents` and `PostgresWritebackIntentRepository`. Intent JSON/digests and lifecycle versions are immutable, forced-RLS tenant/workspace scoped, replay-idempotent, and optimistic-concurrency checked; the live CI test proves maker/checker approval, dispatch/acknowledgement persistence, sibling-tenant exclusion, version conflict refusal, and append-only mutation refusal. No provider payload, secret, network call, live ERP/bank integration, or write-back claim is introduced.
      - E-344 routes the existing proposal, maker-checker approval, and acknowledgement endpoints through a request-scoped PostgreSQL write-back repository when the server profile is enabled. Tenant/workspace headers must match the authenticated execution scope, the proposal actor is bound to the authenticated user, and the response retains `network_dispatch: disabled`; local SQLite mode remains unchanged. Contract coverage passes under ADR 0295. Live provider I/O, secret-vault interoperability, compensation delivery, HA/DR, and production write-back remain open.
      - E-345 adds an explicit provider-neutral HTTPS write-back transport boundary. `WritebackNetworkRegistration` requires exact HTTPS egress, credential references, allowed operations, feature enablement, bounded request/response sizes, rate limits, and finite retries. `WritebackNetworkExecutor` resolves an in-memory payload, verifies its SHA-256 against the intent, sends the same idempotency key across retries, resolves secrets only at call time, validates a canonical provider acknowledgement digest, and returns a replayable dispatch receipt. Synthetic tests cover transport/HTTP failure injection, payload and response tamper, secret isolation, and pinned POST shape. Existing connector manifests remain read-only; live vendor interoperability and production write-back remain open.
      - E-346 adds `reconforge/benchmark/postgres_durable_job_scale.py`, a bounded PostgreSQL multi-worker profile with eight independent connections, four tenant lanes, 64 jobs, four partitions per job, forced-RLS scope, `FOR UPDATE SKIP LOCKED` contention, zero duplicate effects, and a drained queue. `PostgresDurableJobRepository.claim_next` now rechecks the active lease after locking the job row, preventing a stale join snapshot from stealing a live lease. Hosted server-boundaries run `30845549418` passes the live PostgreSQL 16 profile; Security `30845549419`, Docker `30845549425`, and CodeQL `30845549444` pass. This proves a repeatable 256-effect single-node PostgreSQL correctness gate, not throughput, capacity, soak, distributed fairness, queue HA, HA/DR, RPO/RTO, or production sizing.
      - E-347 adds `reconforge/benchmark/postgres_outbox_scale.py`, a bounded four-worker PostgreSQL transactional-outbox profile over 64 synthetic events in one tenant lane. The injected sink records event IDs, and the gate requires every event exactly once with zero pending/claimed/dead rows after acknowledgement. Hosted server-boundaries `30847668458`, Security `30847668487`, Docker `30847668631`, and CodeQL `30847668940` pass. This is a single-node claim/publish/acknowledge correctness gate, not broker semantics, crash-after-publish recovery, queue HA, failover, throughput, soak, or production delivery evidence.
      - E-348 adds migration `0062_pg_outbox_consumer` and `PostgresOutboxConsumer`: an immutable forced-RLS receipt keyed by tenant/consumer/event, advisory serialization, canonical digest recomputation from the persisted outbox JSONB row, a tenant/event foreign key, and a database-local effect callback committed in the same transaction. The live PostgreSQL contract simulates consumer commit followed by lost outbox acknowledgement; lease reclaim returns `duplicate`, the effect and receipt remain singular, the outbox is acknowledged, and a changed or missing event fails closed. Local PostgreSQL 16, full outbox contracts, migration-head, Ruff, and Mypy gates pass. Hosted CI `30851329394` (including server-boundaries, Python 3.11/3.12, parity, and Docker), Security `30851329385`, Docker `30851329398`, and CodeQL `30851329332` pass. This is a bounded single-node database-local business-effect boundary, not external broker exactly-once delivery, queue HA, failover, throughput, soak, or production readiness evidence.
      - E-349 adds `reconforge/benchmark/postgres_grouped_matching_scale.py`, a bounded four-worker PostgreSQL grouped-matching profile over a declared 32-run/64-partition shape cycling one-to-many, many-to-one, true many-to-many, portfolio partial-settlement, and fixed EUR-to-USD FX modes. The live local contract uses five runs/ten partitions and passes with complete checkpoints, mode-derived result cardinality, zero duplicate result identities, zero failed/active runs, and integrity digests. It also canonicalizes PostgreSQL Decimal values such as `0E-18` before result persistence. Hosted code head `3ae39b68` passes CI `30854414579` (including server-boundaries job `91821932337`), Security `30854414587`, Docker `30854414580`, and CodeQL `30854414574`. This is synthetic one-node runtime evidence only; throughput, soak, production sizing, provider/statutory posting, cross-host scheduling, queue HA, automatic failover, and HA/DR remain open under ADR 0300.

  - id: P4-SCL-001
    priority: P4
    area: scale
    goal_workstream: high_volume_concurrency
    title: High-volume concurrent operations and backpressure
    status: in_progress
    depends_on: [P1-PLAT-002, P1-PLAT-003, P1-PLAT-004, P1-REC-010]
    exit_evidence: Reproducible multi-worker load, contention, queue, retry, checkpoint, no-duplicate-effect, memory, backpressure, cancellation, and soak profiles pass on named hardware at each published scale tier.
    completed_slices:
      - E-257 closes the first bounded P4-SCL-001 slice. It adds a reproducible multi-worker durable-job load profile (`reconforge/benchmark/durable_job_load.py`) that drives the existing worker loop (claim/commit_partition/complete_partition) under real ThreadPoolExecutor contention on a shared SQLite database, over a declared small tier (8 workers, 64 jobs, 4 partitions per job, 4 tenants = 256 declared partition effects). The closed schema-v1 manifest carries the structural outcome (declared shape, completed jobs, committed partition effects, duplicate count, final queue/running depth, per-tenant completions, deterministic effect-set digest, environment, explicit limitations) and excludes observed runtime/peak-memory/throughput from the manifest digest so it is reproducible across runs and hardware. `verify_load_manifest` asserts completed jobs equal the declared count, duplicate partition effects are zero, the queue drains to zero, committed effects equal completed * partitions, per-tenant completions sum to the declared count, and limitations retain honest non-claim wording. No new persistence primitive, domain type, repository method, migration, API, CLI, UI, PostgreSQL, tag, release, or deployment is introduced. Backpressure, soak, retry/backoff coupling, cancellation-under-load, PostgreSQL load parity, and 10K/100K/1M/10M tier publication remain later P4-SCL-001 slices.
      - E-258 adds a second bounded P4-SCL-001 slice for queued and running cancellation. `reconforge/benchmark/durable_job_cancellation.py` proves cancelled queued jobs produce no partition effects, non-cancelled jobs complete exactly once, the queue drains without orphaned leases, and a separate running-owner cancellation releases its lease after a bounded committed prefix. Structural digests exclude timing/peak-memory observations; tests, ADR 0214, and distribution membership are included. Backpressure, soak, retry/backoff coupling, PostgreSQL parity, distributed capacity, and 10K/100K/1M/10M tier publication remain open.
      - E-271 adds a bounded concurrent retry/failure-injection profile. A synthetic transient fault after at most one committed partition transitions the job to `retrying`; the next lease resumes from committed effects and completes without duplicate partition effects. The closed manifest verifies retry ceilings, exact effect cardinality, drained queue/running depth, and deterministic effect/manifest digests. ADR 0226, focused contracts, benchmark documentation, and package membership are included. Provider-specific backoff/jitter, external compensation, PostgreSQL parity, soak, and scale-tier publication remain open.
      - E-274 publishes the first declared 10K durable-job tier: 16 workers, 1,000 jobs, 10 partitions per job, and four statically fair tenant lanes. Two complete Windows 11/Python 3.14.6 runs committed 10,000/10,000 effects with zero duplicate effects, drained queues/running depth, and identical structural/effect digests. A bounded 60-second SQLite busy wait prevents transient `BEGIN IMMEDIATE` lock storms from becoming lost work. This remains one-host SQLite evidence; PostgreSQL parity, backpressure, retry/backoff coupling, soak, HA/DR, and 100K/1M/10M tiers remain unverified.
      - E-282 publishes the declared 100K durable-job tier: 16 workers, 10,000 jobs, 10 partitions per job, and four statically fair tenant lanes. Two complete Windows 11/Python 3.14.6 runs committed 100,000/100,000 effects with zero duplicate effects, drained queues/running depth, 2,500 completions per tenant, and identical effect/manifest digests. The bounded benchmark parameters are a 600-second lease and 300-second SQLite busy timeout; they are not production defaults. A 32-worker attempt and a 16-worker/default-timeout attempt failed with SQLite lock contention, so this evidence remains one-host SQLite only; PostgreSQL parity, backpressure, retry/backoff coupling, soak, HA/DR, and 1M/10M tiers remain unverified.
      - E-286 adds a separate bounded producer/backpressure profile over the existing durable-job worker and SQLite repository. An eight-job queued cap is enforced while 8 workers drain 64 jobs across four tenants; two Windows 11/Python 3.14.6 runs observed maximum queue depth 8, completed 256 effects with zero duplicates, drained queue/running depth, and identical effect/manifest digests. This proves only a local producer cap; distributed backpressure, PostgreSQL queue parity, retry backoff, soak, cancellation-under-load, HA/DR, and SLO/capacity remain unverified.
      - E-294 promotes the existing PostgreSQL durable-job application/worker runtime contract through CI server-boundaries. Concurrent idempotent submission, cancellation, leases/heartbeats, partition effects, stale-worker rejection, reconnect resume, and SQLite semantic parity passed under the non-privileged PostgreSQL role. Queue HA, failover, soak, multi-host capacity, and RPO/RTO remain open.
      - E-313 adds a bounded PostgreSQL concurrent-load parity contract to the live server-boundaries test. Two tenant lanes submit six synthetic jobs and two partitions per job; real concurrent PostgreSQL workers claim and finish every job with exact effects, no duplicate partition keys, and completed terminal states. This is a small synthetic runtime gate, not a PostgreSQL capacity, soak, SLO, or distributed-scale claim.
      - E-322 extends the live PostgreSQL durable-job contract with a transient-failure injection after one committed partition. The job enters `retrying`, releases its lease, a recovery worker resumes from the checkpoint, and the remaining partition completes exactly once with ordered transition evidence. This is a small synthetic retry proof, not PostgreSQL capacity, soak, distributed supervision, HA/DR, or production retry-tuning evidence under ADR 0273.
      - E-338 extends the same live contract with four one-tenant jobs, three partitions per job, and two independent worker connections contending on `FOR UPDATE SKIP LOCKED`. All jobs complete with exactly three unique partition effects and the worker completion total equals the declared workload. This is a bounded claim-contention proof, not PostgreSQL throughput, fairness SLO, soak, distributed supervision, queue HA, or production-readiness evidence.
      - E-341 adds an additive atomic bounded-submit contract. SQLite uses `BEGIN IMMEDIATE`; PostgreSQL uses a lane-derived transaction advisory lock under forced RLS. `queued` and `retrying` work count toward the `(tenant_id, workspace_id, entity_id)` cap, identical idempotent replay succeeds while full, and rejected new work leaves no row or transition. CI run `30828746821` passes the live PostgreSQL server-boundary assertions; Security `30828746100`, Docker `30828746066`, and CodeQL `30828746780` also pass. Throughput, global fairness, distributed quota, soak, HA/DR, and production capacity remain unverified.
      - E-342 adds `DurableJobLane` and a process-scoped `RoundRobinDurableJobScheduler`. Worker claims accept optional exact workspace/entity filters; SQLite and PostgreSQL apply those filters under their existing transaction/RLS boundaries. A focused SQLite contract and the live PostgreSQL server-boundary contract alternate two non-empty lanes with no cross-lane claim. CI run `30831774662` passes server-boundaries, both Python suites, all four engine-parity cells, and Docker-parity; Security `30831776530`, Docker `30831774950`, and CodeQL `30831774663` also pass. This proves deterministic scheduler fairness for one scheduler loop only; distributed fairness, throughput, soak, HA/DR, and capacity remain unverified.

  - id: P4-REL-001
    priority: P4
    area: reliability
    goal_workstream: high_availability_and_disaster_recovery
