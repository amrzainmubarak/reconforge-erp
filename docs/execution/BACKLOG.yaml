      - E-318 adds a live PostgreSQL crash/resume contract for the grouped worker. Two synthetic entity partitions run under a non-superuser RLS role; an unhandled process-crash exception is injected after the first atomic checkpoint, a replacement worker is fenced while the original lease is valid, and after explicit lease expiry it resumes only the remaining partition. The gate requires two checkpoints, three unique result identities, attempt two, no duplicate edges, and completion. ADR 0269 and package membership are included. Automatic supervision, HA/DR, soak, capacity, live providers, posting, and write-back remain open.
