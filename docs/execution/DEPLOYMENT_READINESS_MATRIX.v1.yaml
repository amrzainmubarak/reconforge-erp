editions:
  - id: community
    readiness_status: partial
    profile_command: reconforge deployment profiles --edition community
    gates:
      - id: backup_restore
        status: verified_scoped
        evidence: [docs/execution/P3_ENT_009_EXIT_AUDIT.yaml, docs/execution/COMMUNITY_COMPOSE_RUNTIME_E974_2026-08-26.json, tests/test_current_community_compose_runtime_report.py]
        boundary: Current Community Compose schema 46, restart persistence, checksum-verified backup, and independent local restore are proven on one Docker host; no host-loss, encrypted production-key custody, HA/DR, or production SLO claim follows.
      - id: rollback
        status: verified_scoped
        evidence: [docs/execution/P3_ENT_009_EXIT_AUDIT.yaml]
        boundary: Versioned local rollback; no zero-downtime cutover.
      - id: retention_privacy
        status: partial
        evidence: [docs/execution/P3_ENT_006_EXIT_AUDIT.yaml, reconforge/infrastructure/object_storage.py, reconforge/infrastructure/sqlite_evidence.py, reconforge/db/schema.py, tests/test_cli_evidence_local_object_store.py, tests/test_evidence_object_storage.py, docs/adr/0667-sqlite-retention-floor-guard.md]
        boundary: Governance contracts, bounded offline object retention, and the SQLite retention-floor/version guard are verified; complete Community retention/privacy administration, deletion workflow, legal hold, and lifecycle drill remain open.
      - id: identity_and_worker_governance
        status: verified_scoped
        evidence: [docs/adr/0562-digest-bound-deployment-runtime-evidence.md, tests/test_deployment_runtime_evidence.py]
        boundary: Local profile/evidence validation, not identity-provider enforcement.
      - id: external_dependency_boundary
        status: verified_scoped
        evidence: [reconforge/deployment/profiles.py, compose.yaml, tests/test_compose_profile.py, docs/adr/0662-community-compose-local-profile.md]
        boundary: Community Compose now has live local SQLite evidence with an internal network and loopback publication; this is not host firewall, backup, HA/DR, or production proof.
      - id: failure_domain_and_dr
        status: open
        evidence: []
        boundary: Community host-loss and independent-site recovery are not proven.
      - id: sovereign_air_gap
        status: partial
        evidence: [docs/execution/P3_ENT_011_EXIT_AUDIT.yaml]
        boundary: Python-wheel sovereign profile evidence is separate from every Community install.
      - id: customer_managed_keys
        status: open
        evidence: []
        boundary: Customer-managed key custody is not required or proven for Community.
