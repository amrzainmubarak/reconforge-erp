claim_boundary: >-
  This matrix consolidates repository-visible and disposable local evidence for
  deployment modes. It is not a production-readiness, compliance, certification,
  provider-interoperability, or independent-assurance claim. A mode is never
  considered ready from this file alone; every open or partial gate remains an
  explicit operator obligation.
