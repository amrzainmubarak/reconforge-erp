id: finance-operational-posting
name: Reviewed Manual operational posting and full reversal
version: 1.1.0
maturity: experimental
owner: finance-core
dependencies: [finance.core, platform.core, platform.master-data]
incompatible_versions: [unsealed-legacy-entry-adoption, automatic-trade-posting]
data_classification: financial-sensitive
retention_policy: operator-retains-immutable-effects-commands-audit-and-review-provenance
permissions: [finance_core.manage, finance_core.read, finance_core.validate, finance_core.post, finance_core.reverse]
default_roles: [admin]
migrations: [sqlite-47, sqlite-48, postgres-0094, postgres-0095, postgres-0096, postgres-0098]
domain_invariants:
  - exact-balanced-two-to-one-thousand-lines-under-captured-currency-policy
  - authenticated-stable-preparer-and-independent-human-reviewer
  - authenticated-draft-replacement-requires-original-preparer
  - canonical-versioned-review-digest-binds-explicit-post
  - posted-entries-lines-dimensions-effects-and-command-receipts-immutable
  - same-command-and-content-produce-one-business-effect
  - replay-verifies-authoritative-effect-or-linked-reversal-source
  - original-policy-full-inverse-requires-separate-review-and-post
  - period-open-check-and-parent-lock-belong-to-one-transaction
  - audit-outbox-effect-and-command-receipt-commit-or-roll-back-together
  - legacy-missing-provenance-is-never-invented
  - balances-are-selected-period-net-activity-with-explicit-turnover
  - business-date-opening-plus-activity-equals-cumulative-closing
  - opening-current-and-closing-share-retained-currency-policy
