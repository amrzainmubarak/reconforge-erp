  - POST /api/v1/finance-core/entries/{entry_id}/post
  - GET /api/v1/finance-core/postings/{effect_id}
  - POST /api/v1/finance-core/postings/{effect_id}/reversal
  - GET /api/v1/finance-core/posted-trial-balance
  - GET /api/v1/finance-core/posted-balances-as-of
cli_commands:
  - reconforge finance-core posting draft
  - reconforge finance-core posting review
  - reconforge finance-core posting preview
  - reconforge finance-core posting post
  - reconforge finance-core posting effect
  - reconforge finance-core posting reverse
  - reconforge finance-core posting trial-balance
  - reconforge finance-core posting balances-as-of
ui_routes: []
import_schemas: [LedgerEntryRequest, PostRequest, ReversalRequest]
export_schemas: [finance-entry-review-v1, finance-posting-api-v1, finance-posted-balances-v1]
synthetic_fixtures: [tests/test_finance_core.py, tests/test_postgres_finance_posting.py]
threat_model:
  - sibling-tenant-workspace-organization-entity-access
  - forged-command-success-and-cross-source-receipt-substitution
  - self-review-and-checker-replacement-of-maker-content
  - stale-review-period-close-and-repeatable-read-child-races
  - late-evidence-failure-and-lost-acknowledgement
  - javascript-integer-rounding-and-unverified-historical-money-policy
  - privileged-database-owner-is-an-operator-trust-boundary
benchmarks: []
rollback_plan: restore-compatible-pre-upgrade-backup-and-reconcile-new-writes-no-lossy-downgrade
test_matrix:
  - tests/test_finance_posting_domain.py
  - tests/test_finance_posting_api_contract.py
  - tests/test_finance_posting_cli.py
  - tests/test_sqlite_finance_posting.py
  - tests/test_postgres_finance_posting.py
  - tests/test_postgres_finance_posting_concurrency.py
  - tests/test_postgres_finance_posting_api.py
  - tests/test_postgres_finance_posting_restore.py
  - tests/test_finance_balances.py
  - tests/test_sqlite_finance_balances.py
  - tests/test_postgres_finance_balances.py
limitations:
  - manual-entries-and-full-kernel-reversals-only
  - as-of-is-currently-recorded-postings-by-business-date-not-historical-knowledge-time-or-statutory-close
  - no-automatic-opening-import-fiscal-close-or-legacy-validated-entry-adoption
  - no-automatic-inventory-ar-ap-or-cash-to-gl-integration
  - sqlite-http-posting-awaits-recent-session-assurance-adapter
  - no-real-customer-performance-business-roi-or-independent-assurance
