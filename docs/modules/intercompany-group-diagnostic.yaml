id: intercompany_group_diagnostic
name: Explicit-source group reporting and native adjustment diagnostic
version: 1.0.0
maturity: experimental
owner: ReconForge finance maintainers
dependencies: [intercompany_fx, intercompany_source_cashflow, finance_posting, finance_policy, identity, audit, outbox, accrual_deferral_evidence_codec]
incompatible_versions: []
data_classification: confidential_financial
retention_policy: preserve_original_IC2_sources_and_raw_qualified_diagnostic_captures
permissions: [intercompany_fx.read, finance_core.read]
default_roles: {reader: [intercompany_fx.read, finance_core.read]}
migrations: []
backends: {postgresql: targeted_native_development_proof, sqlite: unavailable}
domain_invariants:
  - One to sixteen unique canonically ordered explicitly selected complete original source/report/elimination pins
  - Explicit known-zero opening is retained separately for each complete native source origin
  - Same qualified tenant workspace organization and three native book entities
  - Same captured registry reporting policy and adjustment account IDs chart journal and role map
  - Every original source retains its complete three-person reviewed native effect membership
  - Every party account translation reuses existing IC2 captured-policy conversion and translate_book
  - Native adjustment comes only from actual original posted adjustment effect lines
  - Translated native-adjustment and combined bridge columns each conserve and balance independently
  - Reporting Cash and native adjustment Cash are separate populations
  - Exact referenced native periods are observed in one read-only statement without new period row locks
  - Source elimination completion does not assert formal Close workflow approval readiness or whole-period membership
  - Current read amounts cover every original source and all displayed aggregate reporting values under both permissions
  - Every selected complete original capture remains included in one bounded artifact or the whole request is refused
  - No new financial source review claim journal period transition or schema is written
domain_events: []
api_routes:
  - /api/v1/intercompany-group-diagnostic/report
  - /api/v1/intercompany-group-diagnostic/evidence
cli_commands: [.github/scripts/verify_intercompany_group_diagnostic.py]
ui_routes: [/intercompany-group-diagnostic]
import_schemas: [explicit_intercompany_diagnostic_selection_v1]
export_schemas: [intercompany-group-diagnostic-v1, intercompany-group-diagnostic-evidence-v1, intercompany-group-diagnostic-oracle-v1]
synthetic_fixtures: [tests/fixtures/intercompany-group-diagnostic-native-v1.json]
browser_fixture: tests/intercompany_group_diagnostic_browser.py
required_browser_contract: apps/web/live/intercompany-group-diagnostic.spec.ts
browser_qualification: collected_only_socket_and_populated_restore_pending
threat_model:
  - Selected-source subtotal described as whole-group or formal close readiness
  - Copied translated balances or unsupported native Cash equality
  - Duplicate or omitted source effect and reporting membership
  - Another tenant chart entity journal reporting policy or observed period
  - Cached permissions or single-source amount ceilings leaking larger aggregate values
  - Boolean zero floating JSON duplicate keys changed raw anchor or overwritten proof
  - Oversized envelope or one JSON encoder token per synchronous transport operation
benchmarks: deferred_human_measurement
rollback_plan: remove_additive_module_and_read_routes_no_native_history_or_DDL_changed
test_matrix: [pure_original_pins, exact_period_population, known_zero_source_openings, actual_two_sources_fourteen_effects, native_period_nowait_writer_admission, aggregate_current_read_ceiling_both_permissions, strict_bounded_query_selection, original_source_financial_population_unchanged, ordinary_authenticated_report_and_original_export, independent_Fraction_all_accounts_and_CTA, balanced_rehashed_bridge_refusal, boolean_zero_refusal, raw_anchor, fresh_output, stdlib_helper_source_pin, isolated_normal_and_optimized_execution, bilingual_read_Studio, explicit_each_source_opening, current_authorized_source_cashflow_binding, exact_minor_strings_and_BigInt_bridge, scope_and_session_late_response_refusal, pending_original_download_scope_and_session_refusal, denied_export_clears_previous_money_and_selection, governed_two_source_browser_fixture, stable_original_before_after_callback, three_valid_native_owner_tamper_refusals, required_browser_contract_collected_only]
claims:
  allowed: Experimental diagnostic for explicitly selected complete original paired-trade reporting and native adjustment membership
  excluded: [whole_group_membership, whole_period_membership, formal_close_ready, statutory_consolidation, IFRS_or_US_GAAP_compliance, IAS7_compliance, ownership_NCI, investment_elimination, profit_in_stock, hyperinflation, country_tax, Community_parity, measured_performance]
