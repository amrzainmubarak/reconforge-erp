id: inventory-transfer
name: Governed same-entity warehouse transfer with original cost custody
version: 1.0.0
maturity: experimental
owner: ReconForge inventory operations
dependencies: [inventory-core, inventory-valuation, inventory-receipt-posting, finance-posting, identity, scope-authority]
incompatible_versions: []
data_classification: authorized-financial-operational-source
retention_policy: Immutable original source, native movement, complete cost snapshots, claims/releases, actor commands, audit and outbox; no source deletion.
permissions: [inventory_transfer.read, inventory_transfer.manage, inventory_transfer.approve, inventory_transfer.post, inventory.read, inventory.manage, inventory.post, inventory.valuation.read, finance_core.read]
default_roles: []
migrations: [0146_pg_inventory_transfer]
domain_invariants:
  - One untracked native stock or consumable item in its exact base UOM moves between two distinct internal warehouses explicitly belonging to one current entity.
  - Draft has no reservation. Independent second-human review freezes the complete approved entity FIFO/GL pool and creates one exclusive shared Core quantity claim.
  - Distinct third-human post releases that exact claim and posts the original native Generated Transfer atomically; complete native originals and terminal receipts close at commit.
  - Posted transfer adds no valuation, layer consumption or GL effect and preserves the complete pooled approved FIFO quantities/value and original GL bytes.
  - An inverse is a separately created/reviewed/posted compensating native Transfer child with swapped original locations/quantity; the forward source and native Posted movement remain immutable.
  - Every read and command response requires all current persisted permissions and original parent grants with the complete exposed original amount under captured currency precision.
  - Captured immutable consumption IDs bind the complete approved original outbound document value under the same exact monetary policy for current reads and responses, including historical replay; historical snapshots and sealed ACK bytes are never reconstructed or rewritten.
  - Current human, active assignment/role/permission and sorted original hierarchy grants lock before source, metadata or quantity waits; a locked reread repeats complete source and amount authority.
  - Native evidence seals immutable event identity, type, aggregate, scope, payload and creation time; ordinary Outbox delivery/lease changes remain in original exports without invalidating financial custody.
  - Exact same-command replay returns the original historical source/native ACK under fresh authority; changed actor/request/source/key conflicts.
  - Retained pending or committed full receipt inverses, valuation correction owners and unsupported non-IRP cost owner classes refuse new transfer cost adoption.
  - New adoption proves at most 200 complete posted original physical lines through committed approved IRP receipts, approved one-line native FIFO issues and governed IT1 relocations. Unsupported unvalued receipts/issues and multi-item or multi-line Delivery origins refuse even when physical and approved FIFO aggregate quantities happen to agree.
  - A supported Delivery has one exact native line and approved valuation line; every consumption belongs to the complete original item/UOM/precision/currency pool, and complete quantity/value aggregates equal the line and document. Multiple approved layers for that one item remain supported without location valuation allocation.
  - Every retained original consumption row has exact immutable native membership; captured residual quantity/value use the complete bounded original history, while later appended histories do not rewrite historical source or command bytes.
domain_events: [inventory_transfer.create, inventory_transfer.inverse-create, inventory_transfer.review, inventory_transfer.post, inventory_transfer.cancel]
api_routes:
  - GET /api/v1/inventory-transfer/transfers
  - GET /api/v1/inventory-transfer/transfers/{identifier}
  - GET /api/v1/inventory-transfer/transfers/{identifier}/evidence
  - POST /api/v1/inventory-transfer/transfers
  - POST /api/v1/inventory-transfer/transfers/{identifier}/review
  - POST /api/v1/inventory-transfer/transfers/{identifier}/post
  - POST /api/v1/inventory-transfer/transfers/{identifier}/cancel
  - POST /api/v1/inventory-transfer/transfers/{identifier}/inverse
cli_commands: []
ui_routes: [/inventory-transfer]
import_schemas: [inventory-transfer-v1]
export_schemas: [inventory-transfer-cost-v1, inventory-transfer-command-ack-v1, inventory-transfer-evidence-v1]
synthetic_fixtures: [actual-approved-IRP-three-EA-USD3600-two-warehouse]
threat_model: [changed-native-UOM-or-location, amount-cap-on-only-selected-portion, stale-human-or-parent-grant, source-reservation-double-spend, direct-native-post-or-void, detached-claim-release, fabricated-historical-ACK, missing-or-extra-native-evidence, consumed-destination-inverse, receipt-inverse-race]
benchmarks: []
rollback_plan: Root removes finite dispatch before the owned empty inverse; any retained transfer source refuses destructive rollback and requires an authorized restore. Posted correction is an independently governed compensating transfer.
test_matrix:
  pure: tests/test_inventory_transfer.py
  api_contract: tests/test_inventory_transfer_api_contract.py
  postgresql_initial: tests/test_postgres_inventory_transfer.py
  postgresql_authority: tests/test_postgres_inventory_transfer_read_authority.py
  postgresql_shared_integration: tests/test_postgres_inventory_transfer_integration.py
  postgresql_concurrency: tests/test_postgres_inventory_transfer_concurrency.py
  postgresql_browser_inputs: tests/test_postgres_inventory_transfer_browser.py
  independent_original_oracle: tests/test_inventory_transfer_cycle_oracle.py; tests/test_inventory_transfer_browser_custody.py
  required_browser: apps/web/live/inventory-transfer-cycle.spec.ts
backend_support:
  postgres: development-canonical146-owned-cycle-qualified
  sqlite: unavailable-without-equivalent-native-FIFO-and-source-custody
