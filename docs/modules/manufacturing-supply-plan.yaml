threat_model: [duplicate-net-demand, unrelated-receipt-custody, hidden-master-reinterpretation, unowned-native-command-bypass, stale-human-scope-or-amount-authority, detached-stock-release, self-approval, failed-native-handoff, altered-native-ACK, repeated-financial-effect]
