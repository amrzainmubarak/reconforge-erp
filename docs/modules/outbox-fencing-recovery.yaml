id: outbox-fencing-recovery
name: Lease-fenced transactional outbox recovery evidence
version: 1.0.0
maturity: experimental
owner: platform-reliability
dependencies: [platform.core, platform.audit]
incompatible_versions: [unfenced-outbox-acknowledgement]
data_classification: operational-sensitive
retention_policy: retain-immutable-delivery-transitions-with-parent-outbox-event
permissions: [outbox.publish, outbox.replay, audit.read]
default_roles: [admin]
migrations: []
domain_invariants:
  - every-current-claim-has-an-exact-monotonic-lease-generation
  - same-worker-label-cannot-acknowledge-or-fail-a-newer-generation
  - historical-pre-fencing-claims-are-explicitly-watermarked-not-invented
  - expired-final-attempt-enters-terminal-dead-letter-state
  - state-transition-and-delivery-evidence-commit-or-roll-back-together
  - retained-post-floor-claim-generations-are-contiguous-and-unique
domain_events: []
api_routes: []
cli_commands: []
ui_routes: []
import_schemas: []
export_schemas: [outbox-delivery-evidence-v1]
synthetic_fixtures:
  - tests/test_outbox_fencing_recovery.py
  - tests/test_postgres_outbox_fencing_recovery.py
threat_model:
  - reused-worker-identity-after-crash
  - stale-acknowledgement-or-failure-after-lease-expiry
