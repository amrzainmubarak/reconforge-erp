  - tests/test_postgres_outbox.py
  - tests/test_postgres_outbox_consumer.py
limitations:
  - activation-is-blocked-until-sqlite-postgresql-and-backup-migrations-land
  - bounded-at-least-once-delivery-only-without-a-cooperative-external-sink
  - no-broker-provider-ha-or-production-performance-claim
