owner: business-finance
dependencies: [payables, finance-posting, platform.identity, platform.authorization, platform.audit-outbox]
incompatible_versions: [mutable-ap-payment-allocation, implicit-ap-cash-posting]
data_classification: financial-sensitive
retention_policy: retain-immutable-payment-link-command-audit-and-outbox-evidence
permissions: [payables.read, payables.manage, payables.match, payables.approve, payables.settle]
default_roles: [admin, controller]
migrations: [sqlite-54-payables-finance-payment-link, postgresql-0105-pg-payables-payment-link]
