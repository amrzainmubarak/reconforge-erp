  - allocation-amount-is-a-positive-exact-minor-unit-value-with-no-implicit-conversion
  - finance-snapshot-has-exactly-one-ap-debit-and-one-cash-credit-of-the-allocation-amount
  - finance-effect-source-and-external-reference-bind-to-the-supplier-invoice
  - finance-preparation-review-posting-and-invoice-payment-duties-are-separated-where-evidence-identifies-actors
  - invoice-version-and-cumulative-allocation-are-serialized-and-never-exceed-invoice-total
  - invoice-becomes-paid-only-on-exact-cumulative-allocation-and-links-commands-audit-and-outbox-are-immutable
  - idempotency-key-replay-returns-the-retained-response-and-changed-command-content-is-refused
domain_events: [ap.payment_linked]
api_routes:
