id: procurement-partial
name: Partial stock procurement and exact payable tranches
version: 0.1.0
maturity: experimental
owner: finance-operations
dependencies: [payables, inventory-receipt-posting, operational-finance, financial-installments, finance-core, postgres-identity]
incompatible_versions: []
data_classification: confidential-financial
retention_policy: immutable source documents and append-only command acknowledgements; populated downgrade refuses history loss
permissions: [payables.read, payables.manage, payables.match, payables.approve, payables.settle, inventory.read, inventory.manage, inventory.post, inventory.valuation.manage, inventory.valuation.approve, finance_core.read, finance_core.manage, finance_core.validate, finance_core.post]
default_roles: []
migrations: [0114_pg_procurement_partial]
domain_invariants:
  - An exact single untracked stock line in the supplier and entity functional currency with zero tax
  - Prepared receipt quantities reserve approved ordered capacity under the parent row lock
  - Each reviewed receipt posts actual FIFO, stock movement, inventory GL and native AP goods receipt in one outer transaction
  - Matched invoice quantities reserve posted receipt capacity before approval; exact unit price and monetary total
  - Independent approval and reviewed clearing-to-AP accrual for each partial supplier invoice
  - Shared reviewed installments settle real accrued native AP invoices; each payment has existing immutable AP payment-link and GL evidence
  - Canonical historical actor identities and current persisted authority, scope, amount policy and step-up on writes and retries
  - Each parent version has exactly one exact actor-bound command with frozen acknowledgement, audit and outbox evidence
  - Deferred OLD and NEW reverse source closure rejects detached native approval, stock receipt, accrual and unrelated financial effects
domain_events: [procurement.partial_changed]
api_routes: ["/api/v1/procurement-partial/orders", "/api/v1/procurement-partial/orders/{id}", "/api/v1/procurement-partial/orders/{id}/commands/{action}", "/api/v1/procurement-partial/options", "/api/v1/procurement-partial/scopes"]
cli_commands: []
ui_routes: [/procurement-partial]
import_schemas: []
export_schemas: []
synthetic_fixtures: [tests/test_postgres_procurement_partial.py]
threat_model:
  - Four forced-RLS tables join the canonical tenant/workspace/organization/entity boundary including entity aliases
  - Row locks serialize same-order capacity reservation; exact command advisory locks fence replay
  - Phase-specific command versions bind source preparer, approver, reviewer and poster to canonical retained identities
  - Reserved PPR receipt and PPI invoice numbers cannot be captured outside their atomic source owner
  - Public generic participants cannot commit an owner phase independently; database closure remains authoritative
  - Supplier return, receipt reversal and payment reversal require separate completed contracts and are refused for this owner
benchmarks: []
rollback_plan: Empty downgrade only; retained history requires a verified pre-upgrade backup and a forward correction
test_matrix:
  domain: tests/test_procurement_partial.py
  postgres: tests/test_postgres_procurement_partial.py
  web: apps/web/src/procurement-partial-data.test.ts
  browser: Lead integration gate on normal authenticated Studio and actual PostgreSQL
adapter_matrix:
  postgres: implemented; acceptance requires the current integration gate
  sqlite: no implicit fallback
limitations:
  - One stock line per order, at most 32 receipts and 32 invoices
  - Functional currency, untracked stock, exact minor-unit costs and zero tax
  - Shared installment contract has its own migration and acceptance gates
  - No PR/RFQ, supplier quotation selection, supplier returns, debit notes, tax, FX, live bank transfers or tracked-stock claim
  - Reference catalogs are configured through existing engines and are bounded to their current authorized 200 records
