benchmarks: []
rollback_plan: preserve-command-history-refuse-unknown-envelope-use-authorized-current-get
test_matrix: [tests/test_receivables_invoice_replay_domain.py, tests/test_receivables_invoice_replay.py, tests/test_receivables_invoice_recovery.py, tests/test_receivables_invoice_replay_api.py, tests/test_postgres_invoice_recovery_restore.py]
limitations: [read-committed-concurrency-profile, active-canonical-hierarchy-required, legacy-omitted-date-get-fallback, public-db-export-excludes-ar-history, no-receipt-protocol-change, no-generated-gl]
