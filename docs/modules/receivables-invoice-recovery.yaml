data_classification: financial-sensitive
retention_policy: retain-original-command-and-invoice-evidence
permissions: [receivables.read, receivables.manage]
default_roles: [admin, preparer]
migrations: []
domain_invariants:
  - request-digest-is-not-source-authority
  - exact-request-scope-and-ordered-source-lines-must-match
  - retained-policy-and-original-attribution-must-verify
