runtime_acceptance: legacy bounded local PostgreSQL API Studio and populated restore accepted on6ec9 and bounded partial returns on375; new monetary149 source and all actual native HTTPS restore and final CI gates remain pending and do not constitute completed functionality
scope_limits:
  - PostgreSQL only; existing local workflows remain available
  - Legacy single-item APIs and immutable history preserve their accepted contracts
  - Commercial parents support up to 1000 explicit non-lot product-location lines in functional currency with per-line partial native tranches
  - Each invoice tranche is settled in full; partial settlement of one AR invoice is not claimed
  - The original single-source and commercial tranche protocols retain their explicit zero-tax interpretation
  - New fixed monetary protocol uses configured synthetic tax rules only; no statutory country compliance or universal tax coverage is claimed
  - New monetary partial returns and closing capabilities remain unaccepted pending one-source native HTTPS restore independent financial and CI evidence
  - Configurable enterprise price lists country tax packs and full corporate finance remain outside the closed legacy contract
