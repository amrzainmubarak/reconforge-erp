  - tests/test_postgres_stock_commerce.py multi-product multi-warehouse partial delivery invoice and collection tranches
  - tests/test_postgres_monetary_customer_partial_returns.py genuine native identity and foreign originals and positive transaction zero-functional cash
threat_model:
  - stale or forged authority and amount permissions
  - over-reservation and concurrent native stock withdrawal
  - re-costing frozen FIFO or bypassing native source owner
  - detached COGS, revenue or cash posting
  - cross-entity receipt namespace collision
  - direct SQL native tranche transition outside its parent acknowledgement
  - partial commercial line quantity or financial value overcommit
  - monetary correction source substitution mismatched historical carrying and counterfeit zero financial evidence
  - active closing valuation confused with private historical refund or credit allocation basis
benchmarks: []
