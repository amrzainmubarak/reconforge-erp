    review_cadence_days: 30
    next_review: "2026-08-24"
  - id: R-006
    title: Large datasets exceed memory
    category: reliability
    owner: performance-reliability
    trigger: Candidate generation or global assignment materializes an unbounded working set or exceeds declared memory/runtime limits.
    likelihood: possible
    impact: high
    inherent_risk: medium
    status: partially_mitigated
    mitigations:
      - DuckDB provides bounded relation batches and work-order partition execution.
      - Hosted workers stream explicit hard-key partitions and checkpoint completed output.
      - No million-row claim is allowed after the timed-out local attempt.
    evidence:
      - reconforge/engines/duckdb_engine.py
      - tests/test_generator_benchmark_engines.py
    residual_risk: medium
    residual_rationale: Global matching still materializes its graph and peak-memory evidence is incomplete.
    next_actions:
      - Implement bounded candidate pruning/global assignment where justified.
      - Record trustworthy peak RSS and a reproducible one-million-row tier before any claim.
    review_cadence_days: 60
    next_review: "2026-09-23"
  - id: R-007
    title: Local identity is not enterprise identity
    category: identity
    owner: identity-security
    trigger: A deployment relies on local password/session behavior while claiming or requiring OIDC, SAML, SCIM, MFA, or enterprise lifecycle controls.
    likelihood: possible
    impact: high
    inherent_risk: medium
    status: partially_mitigated
    mitigations:
      - Tenant-scoped PostgreSQL password, RBAC, session, revocation, and bounded server-auth paths are tested.
      - Static-JWKS OIDC and fixed-certificate SAML assertions use reviewed libraries, server-issued one-time challenges, durable replay, prelinked local authority, sanitized audit, and the existing revocable session.
      - Authenticated SCIM User/Group HTTP and forced-RLS PostgreSQL lifecycle provide hash-only revocable client credentials, domain-scoped idempotency, role-free groups, conditional versions, sanitized audit, and atomic identity deactivation plus session revocation.
      - Role-free service accounts use explicit direct least privilege, database-enforced human-only permission denial, hash-only bounded credentials, atomic rotation/revocation, forced RLS, append-only lifecycle events, and typed HTTP machine-principal composition without user roles.
      - Privileged PostgreSQL permissions require a current role grant plus a short-lived forced-RLS append-only password-reauthentication assertion bound to the same human session; this is not represented as MFA.
      - PostgreSQL role, role-permission, and user-role lifecycle is optimistic, tenant-scoped, audited, session-invalidating, retirement-safe, and protected against removing the final active roles.manage authority; the SQLite role shadow is disabled in server mode.
      - Native federation links, SCIM credentials, service accounts, and notification routes have one human/MFA-governed optimistic disable surface whose transaction changes the runtime authority and appends bounded audit evidence.
      - PostgreSQL audit administration is human/MFA-governed, cursor-bound, tenant-RLS-scoped, and redacted; domain and ledger-control chains verify separately without a global-chain claim.
      - Documentation explicitly withholds enterprise identity claims.
    evidence:
      - reconforge/infrastructure/postgres_identity.py
      - tests/test_api_server_identity.py
      - tests/test_api_federation.py
      - tests/test_oidc_verifier.py
      - tests/test_saml_verifier.py
      - reconforge/auth/scim.py
      - reconforge/infrastructure/postgres_scim.py
      - reconforge/infrastructure/postgres_scim_auth.py
      - reconforge/api/routes/scim.py
      - tests/test_api_scim.py
      - tests/test_postgres_scim.py
      - tests/test_postgres_scim_auth.py
      - reconforge/infrastructure/postgres_service_accounts.py
      - tests/test_postgres_service_accounts.py
      - reconforge/api/server_identity.py
      - tests/test_api_service_accounts.py
      - reconforge/infrastructure/postgres_privileged_sessions.py
      - tests/test_postgres_privileged_sessions.py
      - tests/test_api_privileged_sessions.py
      - reconforge/application/security_center.py
      - reconforge/infrastructure/postgres_security_center.py
      - reconforge/api/routes/security_center.py
      - tests/test_postgres_security_center.py
      - tests/test_api_security_center.py
      - reconforge/application/identity_administration.py
      - reconforge/infrastructure/postgres_identity_administration.py
      - reconforge/api/routes/identity_administration.py
      - tests/test_postgres_identity_administration.py
      - tests/test_api_identity_administration.py
      - reconforge/application/access_administration.py
      - reconforge/infrastructure/postgres_access_administration.py
      - reconforge/api/routes/access_administration.py
      - tests/test_postgres_access_administration.py
      - tests/test_api_access_administration.py
      - reconforge/application/security_governance.py
      - reconforge/infrastructure/postgres_security_governance.py
      - reconforge/application/audit_browsing.py
      - reconforge/infrastructure/postgres_audit_browsing.py
      - reconforge/api/routes/audit_administration.py
      - tests/test_audit_browsing.py
      - tests/test_api_audit_administration.py
      - reconforge/api/routes/security_governance.py
      - tests/test_postgres_security_governance.py
      - tests/test_api_security_governance.py
    residual_risk: medium
    residual_rationale: Federation, SCIM, service accounts, privileged sessions, emergency review, WebAuthn, a count-only security overview, authoritative PostgreSQL user/session/role/policy lifecycle, and native integration disable are implemented. Workload federation, recovery and attestation governance, hosted interoperability, integration creation/enable/secret rotation, accessible UI, provider logout, and independent assurance remain absent.
    next_actions:
      - Implement recovery and attestation governance plus workload identity federation as separately governed slices.
      - Add provider interoperability, integration creation/enable/secret-rotation governance, accessible UI, and independent security evidence.
    review_cadence_days: 60
    next_review: "2026-09-23"
  - id: R-008
    title: Outbox is not yet a hosted delivery system
    category: operations
    owner: platform-operations
    trigger: An event is published twice, lost after commit, replayed unsafely, or left undelivered because external transport and hosted scheduling are incomplete.
    likelihood: possible
    impact: high
    inherent_risk: medium
    status: partially_mitigated
    mitigations:
      - SQLite and PostgreSQL outboxes implement claim, lease, retry, dead-letter, and replay states.
      - Bounded workers use fresh connections and tested ownership transitions.
      - The scheduler worker bounds tenant enumeration, uses one UTC instant per cycle, and opens fresh connections.
      - Optional notification payloads are closed and redacted; destinations are digest-bound to immutable forced-RLS routes.
      - HTTPS/SMTPS egress is default-off, exact-allowlisted, TLS-only, public-address checked, and pinned after DNS validation.
    evidence:
      - reconforge/infrastructure/postgres_outbox.py
      - reconforge/workers/postgres_scheduler.py
      - reconforge/application/notifications.py
      - reconforge/infrastructure/notification_transports.py
      - reconforge/infrastructure/postgres_notifications.py
      - tests/test_postgres_outbox.py
      - tests/test_notifications.py
      - tests/test_postgres_notifications.py
    residual_risk: medium
    residual_rationale: Concrete transports and a bounded tenant enumerator now exist, but only injected synthetic transports are tested. A crash after provider acceptance and before outbox acknowledgement can still duplicate delivery; real provider interoperability, production secret custody, managed deployment, HA, and receiver-side idempotency evidence are absent.
    next_actions:
      - Exercise approved real providers and receiver-side idempotency without customer data or repository secrets.
      - Add crash-after-publish recovery, observability, capacity, HA, and managed deployment exercises.
    review_cadence_days: 60
    next_review: "2026-09-23"
