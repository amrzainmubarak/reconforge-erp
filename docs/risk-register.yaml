  - id: R-019
    title: Network connector trust, egress, and replay failure
    category: security
    owner: platform-security
    trigger: A connector package, destination, credential, response, cursor, retry, or resumed page crosses its declared trust and tenant boundary.
    likelihood: possible
    impact: critical
    inherent_risk: high
    status: partially_mitigated
    mitigations:
      - Closed read-only manifests and registrations reject write capability, undeclared endpoints, unsafe URL components, and unknown fields.
      - Data-only 64 KiB packages use Ed25519 with a versioned active/revoked exact publisher-key registry and cannot declare executable entry points.
      - HTTPS execution rejects any non-global DNS answer, pins one validated address while retaining TLS hostname verification, and never follows redirects.
      - Secret values resolve only at execution through a disabled-by-default protocol and are absent from manifests, registrations, results, checkpoint artifacts, and safe errors.
      - Cursor, idempotency key, timeout, response, rate, retry-attempt, and retry-delay bounds fail closed; policy and permanent failures are not retried.
      - Immutable tenant page artifacts and generation-fenced durable-job effects bind registration, request, response, object, and output-chain digests for tested SQLite crash/resume.
