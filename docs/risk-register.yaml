  - id: R-018
    title: Unbounded or hostile local file parsing
    category: security
    owner: platform-security
    trigger: An operator-selected or generated file reaches a parser without enforced type, size, shape, decompression, active-content, and safe-error boundaries.
    likelihood: likely
    impact: high
    inherent_risk: high
    status: partially_mitigated
    mitigations:
      - Versioned tabular ingress preflight bounds canonical CSV/XLS/XLSX, mapping, DuckDB, and built-in CSV adapter paths before normal parsing.
      - A closed schema-v1 inventory and AST allowlist fail when a direct tabular parser call appears without an explicit surface record.
      - Versioned structured-document ingress bounds selected JSON/YAML bytes, nodes, depth, collections, scalars, and aliases; configuration/mapping/control, close-workflow, client-pack manifest, and evidence-index files reject duplicate keys and unsafe or over-budget structures before domain validation.
      - Client-pack JSON redaction preflights through the same boundary before fingerprint hashing or destination preparation, preserving strict fractional/exponent lexemes and legacy finite-float behavior while rejecting malformed JSON instead of reinterpreting it as text.
      - Client-pack CSV redaction preflights through tabular-file-ingress-v1 before hashing/output, rejects duplicate headers, preserves exact field strings, and streams rows through a temporary file with per-file atomic replace.
      - Client-pack text and non-redacted copies now share file-count, traversal, per-file, aggregate, regular-file, and change-detection budgets; generic text uses strict UTF-8 bounded-line streaming.
      - Client-pack generation freezes the selected source set, builds and rechecks the complete pack in a sibling staging directory, and preserves or restores prior output on handled generation/publication failure.
      - Local DB restore backup/manifest JSON uses fixed byte/node/depth/collection/scalar ceilings, duplicate/non-finite rejection, regular non-reparse paths, stable pre/post-read fingerprints, and closed manifest/backup/table-name validation before temporary restore allocation or target mutation.
      - Legacy DB account/control JSON imports use fixed byte/node/depth/collection/scalar ceilings, duplicate/non-finite rejection, stable regular non-reparse reads, unambiguous envelope/list/map shapes, and parsed-byte digest/size provenance before database inspection or mutation.
      - FI-008 business-record CSV/JSON imports use fixed byte/record/field/cell/scalar and JSON node/depth ceilings, strict ambiguity/shape/encoding checks, exact fractional lexemes, stable fingerprints, and parsed-byte provenance before domain mutation.
      - FI-007 Studio generated CSV/JSON uses fixed byte/row/column/cell/field plus JSON node/depth/collection/scalar ceilings, duplicate/header/non-finite rejection, stable fingerprints, safe empty views, and optional companion shape/count consistency while preserving display typing.
      - FI-006 variance CSV/JSON and management-report JSON reuse the same bounded stable reader; variance selects an explicit exact-text CSV representation before Decimal validation while Studio keeps display inference.
      - FI-005 evidence/review CSV reuses explicit strict/legacy representations; evidence generation parses each selected CSV once and binds v3 fingerprints to the cached parsed bytes with final stability verification.
      - FI-014 review-state JSON uses a 16 MiB/500000-node/depth-32/100000-item bounded duplicate-safe profile with stable regular-file fingerprints; malformed present input fails visibly and rejected updates preserve the original while valid legacy coercion remains.
      - Exact AST allowlists close current direct tabular/JSON/YAML calls. FI-015 generated report/workflow/demo and FI-016 user-selected explanation JSON use bounded stable readers with explicit display/exact-text numeric representation; FI-013 persisted decoders and FI-017 package text are classified separately.
      - FI-013 AP/AR idempotency response producers and consumers use canonical object JSON under 4 MiB/100000-node/depth-32/25000-item/262144-character ceilings with unique keys and integer-only number tokens; producer rejection rolls back and corrupt replay rejects before a new financial business/audit/outbox effect.
      - FI-013 SQLite matching rules use one 4 MiB/100000-node/depth-32/25000-item/262144-character finite-object profile across both table writes, replay, and public readers; encoding precedes the transaction and preserves historical spaced bytes and policy defaults.
      - FI-013 tenant-scoped Redis sessions use one closed 16 KiB/16-node/depth-2/four-field/256-character profile with digest and explicit-UTC validation; producer rejection precedes client access and corrupt reads do not mutate stored values.
      - FI-013 public SQLite export maintains an exact five-field JSON registry. Audit/rule fields reuse established profiles; legacy summaries and matching lineage use two new 4 MiB/100000-node/depth-32/25000-item/262144-character finite-object profiles across producer and export validation.
      - Export validates every registered JSON row before destination creation or file writes, rejects non-text/corrupt values without a sentinel or audit effect, and preserves all format-v1 field shapes including the lineage_json string.
      - Existing-output publication writes a versioned, self-validating local transaction marker before the first rename; an explicit recovery command verifies exact siblings and bounded previous/staged tree digests against a closed state table before restoring, finalizing, or deleting anything.
      - The closed AST allowlist also fails when a direct PyYAML load or parse call appears without an explicit surface record.
    evidence:
      - reconforge/io/ingress.py
      - reconforge/io/structured.py
      - reconforge/io/records.py
      - reconforge/io/generated.py
      - reconforge/io/persisted.py
      - docs/security/file-ingestion-inventory.v1.yaml
      - tests/test_file_ingress_security.py
      - tests/test_structured_ingress_security.py
      - tests/test_business_record_ingress.py
      - tests/test_studio_artifact_ingress.py
      - tests/test_generated_report_ingress.py
      - tests/test_evidence_review_csv_ingress.py
      - tests/test_review_state_json_ingress.py
      - tests/test_direct_json_ingress_inventory.py
      - tests/test_financial_idempotency_json.py
      - tests/test_close_workflow_structured_ingress.py
      - tests/test_generated_manifest_structured_ingress.py
