schema_version: 1
registry_id: reconforge-risk-register
risk_method:
  likelihood_scale:
    unlikely: 1
    possible: 2
    likely: 3
    almost_certain: 4
  impact_scale:
    low: 1
    medium: 2
    high: 3
    critical: 4
  rating_thresholds:
    low: [1, 3]
    medium: [4, 7]
    high: [8, 11]
    critical: [12, 16]
last_reviewed: "2026-07-30"
risks:
  - id: R-001
    title: Hosted tenant escape
    category: security
    owner: platform-security
    trigger: A hosted request, worker, cache, object, export, or repository operation reads or mutates another tenant's data.
    likelihood: likely
    impact: critical
    inherent_risk: critical
    status: partially_mitigated
    mitigations:
      - Strict local tenant path/header routing and transaction-local PostgreSQL tenant scope.
      - Forced RLS, composite foreign keys, and explicit schema-only matcher boundaries.
      - Live identity, session, evidence, and reconciliation isolation contract tests where services are available.
    evidence:
      - reconforge/infrastructure/postgres.py
      - tests/test_tenant_isolation.py
    residual_risk: high
    residual_rationale: Most domain persistence and cache/object/export integration remain outside one end-to-end hosted isolation proof.
    next_actions:
      - Add live repository, worker, cache, object-storage, and export tenant-escape tests.
      - Complete shared-schema domain migrations behind tenant-scoped repository contracts.
    review_cadence_days: 14
    next_review: "2026-08-08"
  - id: R-002
    title: Complete ERP capability overclaim
    category: product
    owner: product-governance
    trigger: Public or sales-facing wording describes ReconForge as a complete ERP or claims unverified enterprise, banking, scale, or compliance maturity.
    likelihood: likely
    impact: critical
    inherent_risk: critical
    status: partially_mitigated
    mitigations:
      - README, architecture, evidence matrix, and AP/AR documents state bounded scope and non-goals.
      - Public wording is governed by the claims evidence matrix.
    evidence:
      - README.md
      - docs/execution/CLAIMS_EVIDENCE_MATRIX.md
    residual_risk: medium
    residual_rationale: Broad capability files and future copy can still drift without automated maturity-label enforcement.
    next_actions:
      - Add CI enforcement linking public claims and module maturity to evidence records.
      - Require end-to-end evidence and an approved ADR before changing positioning.
    review_cadence_days: 14
    next_review: "2026-08-08"
  - id: R-003
    title: Business change without audit evidence
    category: audit
    owner: domain-integrity
    trigger: A financial or operational lifecycle mutation commits while its required audit event or outbox evidence is missing.
    likelihood: likely
    impact: high
    inherent_risk: high
    status: partially_mitigated
    mitigations:
      - Migrated services write business, audit, and required outbox records atomically.
      - Forced audit/outbox failure tests prove rollback for migrated boundaries.
    evidence:
      - tests/test_atomic_legacy_services.py
      - reconforge/platform/outbox.py
    residual_risk: high
    residual_rationale: Several legacy platform services have not yet adopted the atomic mutation contract.
    next_actions:
      - Inventory and migrate remaining mutating services.
      - Add failure-injection tests to every migrated transaction boundary.
    review_cadence_days: 30
    next_review: "2026-08-24"
  - id: R-004
    title: Floating-point financial storage
    category: financial_integrity
    owner: financial-integrity
    trigger: A monetary value, tolerance, balance, cost, or financial difference is parsed, stored, or compared through binary floating point.
    likelihood: likely
    impact: high
    inherent_risk: high
    status: partially_mitigated
    mitigations:
      - Named strict-v2 parsing and canonical Decimal text protect current reconciliation writers.
      - Classified source ledger records every remaining float compatibility boundary.
      - Exact round-trip and strict rejection tests cover migrated paths.
    evidence:
      - docs/execution/FLOAT_BOUNDARY_CLASSIFICATION.md
      - tests/test_financial_input_policy.py
    residual_risk: high
    residual_rationale: Public compatibility readers and SQLite REAL-affinity columns remain in non-migrated boundaries.
    next_actions:
      - Migrate the next classified financial compatibility boundary with versioned reader/writer evidence.
      - Replace remaining financial REAL projections with canonical exact storage.
    review_cadence_days: 30
    next_review: "2026-08-24"
  - id: R-005
    title: Incomplete shared exception taxonomy
    category: data_model
    owner: reconciliation-domain
    trigger: Different domains encode equivalent exceptions with incompatible types, severities, evidence links, or lifecycle semantics.
    likelihood: likely
    impact: high
    inherent_risk: high
    status: open
    mitigations:
