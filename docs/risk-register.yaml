  - id: R-014
    title: Evidence artifacts are not yet centrally stored
    category: security
    owner: evidence-security
    trigger: Evidence bytes are uploaded, downloaded, retained, replicated, or deleted without authorized checksum, malware, tenant, and retention enforcement.
    likelihood: likely
    impact: high
    inherent_risk: high
    status: partially_mitigated
    mitigations:
      - S3-compatible adapter verifies checksums, tenant keys, bounded reads, optional encryption/retention, and disables deletion by default.
      - Local/PostgreSQL registries preserve immutable artifact metadata and verification state.
      - PostgreSQL retention policies and append-only assignments can extend but cannot shorten the versioned evidence metadata floor.
    evidence:
      - reconforge/infrastructure/object_storage.py
      - tests/test_evidence_object_storage.py
      - reconforge/infrastructure/postgres_security_governance.py
      - tests/test_postgres_security_governance.py
    residual_risk: high
    residual_rationale: Database retention metadata is monotonic, but propagation to object-store lock, backups, replicas, exports, restore workflows, and legal-hold authority remains open alongside worker upload, malware scanning, and download authorization.
    next_actions:
      - Implement trusted storage worker and malware-scanning hook.
      - Add signed-download authorization and verified retention propagation across object storage, backup, replica, export, restore, and tenant-escape paths.
    review_cadence_days: 30
    next_review: "2026-08-24"
