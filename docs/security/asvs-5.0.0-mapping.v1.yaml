schema_version: 1
mapping_id: reconforge-owasp-asvs-5.0.0
status: evidence-bounded
last_reviewed: "2026-07-26"
claim_boundary: >-
  This is a scoped repository-evidence mapping for selected OWASP ASVS 5.0.0
  requirements across all chapters. It is not a full 345-requirement assessment,
  not a compliance assessment or certification, not a penetration test or audit
  opinion, and not a secure-deployment or continuous-control guarantee.

standard:
  name: OWASP Application Security Verification Standard
  version: 5.0.0
  release_status: stable
  release_date: "2025-05-30"
  verified_at: "2026-07-25"
  release_tag: v5.0.0_release
  release_commit: 5cf9b032440be53ce345ab3c130fda46ba1ce7a2
  official_project_url: https://owasp.org/www-project-application-security-verification-standard/
  official_release_url: https://github.com/OWASP/ASVS/releases/tag/v5.0.0_release
  official_source_url: https://raw.githubusercontent.com/OWASP/ASVS/v5.0.0_release/5.0/docs_en/OWASP_Application_Security_Verification_Standard_5.0.0_en.csv
  official_source_sha256: 98c8fe911b9edb403af8ee05d3ce8201ecac2659e313b053890a62847cdcf680
  official_source_bytes: 105100
  license: CC-BY-SA-4.0
  reference_format: v<version>-<chapter>.<section>.<requirement>
  excluded_source: >-
    The mutable master-branch Bleeding Edge release was checked but excluded;
    OWASP explicitly directs production users to the stable v5.0.0 release.

assessment_scope:
  target: Dirty ReconForge repository snapshot documented in docs/execution/STATE.md.
  coverage_type: all-chapter-selected-requirement
  method:
    - Verify the latest stable version, release tag, commit, source bytes, digest, chapter counts, levels, and reference format from official OWASP sources only.
    - Select high-relevance requirements for current file, API, identity, persistence, evidence, dependency, and deployment boundaries; do not copy full requirement prose.
    - Link only existing repository code, test, workflow, or governance evidence and preserve an explicit limitation and next action for every status.
    - Treat all requirements not listed below as unassessed, not passed, failed, planned, or not applicable.
  excluded_assurance:
    - No live deployment configuration, external penetration test, DAST, fuzzing campaign, production log review, or independent control assessment was performed.
    - No ASVS verification level, certification, compliance, secure-product, or release-readiness claim is assigned.
  review_triggers:
    - OWASP publishes a newer stable ASVS release or changes the pinned release source.
    - ReconForge adds or materially changes an API, browser, file, identity, token, cryptography, network, logging, dependency, or WebRTC surface.
    - A linked evidence path, threat model, security architecture control, or assessment status changes.

status_definitions:
  implemented: A narrowly stated repository scope has direct code and test evidence; deployment operation and the rest of the requirement remain outside the status.
  partial: Some relevant repository behavior or governance exists, but the requirement or its product/deployment scope is incomplete.
  planned: The requirement is applicable or expected to become applicable, but current evidence is insufficient for a partial status.
  not_applicable: The named technology or capability is absent from the assessed snapshot; a concrete trigger requires reassessment if it is introduced.
  unassessed: The official requirement is not one of the selected mappings and receives no implementation, gap, applicability, or assurance conclusion.

summary:
  official_chapter_count: 17
  official_requirement_count: 345
  mapped_requirement_count: 55
  unassessed_requirement_count: 290
  status_counts:
    implemented: 4
    partial: 34
    planned: 10
    not_applicable: 7

chapters:
  - chapter_id: V1
    chapter_name: Encoding and Sanitization
    official_requirement_count: 30
    chapter_assessment: partial
    chapter_boundary: Selected injection, spreadsheet-export, and parser controls only; 27 requirements remain unassessed.
    mappings:
      - requirement_id: v5.0.0-1.2.4
        level: 1
        status: partial
        scope: SQLite and PostgreSQL repository queries reviewed in the current bounded paths.
        owner: platform-security
        evidence: [reconforge/db/backup.py, reconforge/infrastructure/postgres.py]
        test_evidence: [tests/test_db_backup_restore.py, tests/test_db_backup_structured_ingress.py, tests/test_postgres_foundation.py]
        assessment: Values use parameters and dynamic identifiers in the reviewed backup path pass a strict identifier allowlist.
        gap_or_limitation: No whole-repository query audit or live database injection assessment has been completed.
        next_action: Add a query-construction inventory and injection-focused contract tests for every persistence adapter.
      - requirement_id: v5.0.0-1.2.10
        level: 3
        status: planned
        scope: CSV/XLSX report and evidence exports opened by spreadsheet software.
        owner: evidence-security
        evidence: []
        test_evidence: []
        assessment: Output escaping exists for structure, but formula-injection neutralization is not a documented cross-export contract.
        gap_or_limitation: User-controlled leading formula characters may remain dangerous in spreadsheet consumers.
        next_action: Define and test one versioned spreadsheet-cell safety policy without corrupting financial source evidence.
      - requirement_id: v5.0.0-1.5.1
        level: 1
        status: partial
        scope: Production XML parsing surfaces in the current registered modules.
        owner: platform-security
        evidence: [reconforge/connectors/camt053.py, reconforge/connectors/bank_statement_camt053.py]
        test_evidence: [tests/test_connector_camt053.py, tests/test_connector_bank_statement_camt053.py]
        assessment: The bounded CAMT.053 parser uses defusedxml and rejects the tested entity-expansion and malformed-input cases before returning a statement.
        gap_or_limitation: This is selected ISO 20022 evidence only; full XML attack coverage, bank dialect coverage, source authenticity, and deployment certificate policy remain unassessed.
        next_action: Extend the XML threat model and provider conformance evidence before making a broader XML security claim.

  - chapter_id: V2
    chapter_name: Validation and Business Logic
    official_requirement_count: 13
    chapter_assessment: partial
    chapter_boundary: Selected validation, transaction, and multi-user approval requirements only; 10 remain unassessed.
    mappings:
      - requirement_id: v5.0.0-2.2.1
        level: 1
        status: partial
        scope: Current financial, schema, identifier, and workflow decision inputs.
        owner: financial-integrity
        evidence: [reconforge/validators.py, reconforge/utils/money.py]
        test_evidence: [tests/test_validation.py, tests/test_financial_input_policy.py]
        assessment: Exact financial values and selected structures fail closed or become explicit data-quality findings.
        gap_or_limitation: Validation is not uniform across every legacy interface and file type.
        next_action: Complete P0 financial compatibility migration and P0-SEC-009 ingestion abuse coverage.
      - requirement_id: v5.0.0-2.3.3
        level: 2
        status: partial
        scope: Migrated SQLite/PostgreSQL business mutation, audit, and outbox paths.
        owner: domain-integrity
        evidence: [reconforge/platform/common.py, reconforge/platform/outbox.py]
        test_evidence: [tests/test_atomic_legacy_services.py, tests/test_outbox_delivery.py]
        assessment: Selected business changes and their audit/outbox effects share explicit transaction boundaries and rollback tests.
        gap_or_limitation: Legacy services and external publisher effects are not transactionally or idempotently equivalent.
        next_action: Finish the mutation inventory and add repository-specific rollback/idempotency contracts.
      - requirement_id: v5.0.0-2.3.5
        level: 3
        status: partial
        scope: Implemented preparer/reviewer/approval and high-risk local control workflows.
        owner: identity-security
        evidence: [reconforge/auth/policy.py, reconforge/auth/rbac.py, reconforge/application/approvals.py, reconforge/infrastructure/sqlite_approvals.py, reconforge/platform/approvals.py]
        test_evidence: [tests/test_policy_engine.py, tests/test_approval_sod.py, tests/test_approval_surface_inventory.py, tests/test_workflow_state_machine.py]
        assessment: The central primitive denies missing permissions and unauthorized supplied tenant/workspace/entity/period scopes; generated ownership properties and an exact inventory cover all nine current platform approve/review service methods, including trusted-local workflow labels.
        gap_or_limitation: The property primitive is not universally integrated at every route/repository, and amount/region/data-class rules, assignments/delegation, privileged emergency access, external identity governance, and deployed effectiveness remain incomplete.
        next_action: Extend centralized ABAC through route/repository contracts and implement governed delegation and emergency-access workflows without weakening the closed self-approval property.

  - chapter_id: V3
    chapter_name: Web Frontend Security
    official_requirement_count: 31
    chapter_assessment: partial
    chapter_boundary: Selected rendering, response-header, and request-origin safeguards only; 28 remain unassessed.
    mappings:
      - requirement_id: v5.0.0-3.2.2
        level: 1
        status: partial
        scope: Server-rendered Studio and generated HTML surfaces covered by escaping tests.
        owner: platform-security
        evidence: [reconforge/studio/components.py, reconforge/reports/html.py]
        test_evidence: [tests/test_studio_auth.py, tests/test_reports.py]
        assessment: Selected dynamic HTML uses explicit escaping and regression tests cover hostile values.
        gap_or_limitation: No complete template/render sink inventory or browser DAST exists.
        next_action: Inventory every HTML/DOM sink and add browser security tests for untrusted content.
      - requirement_id: v5.0.0-3.4.4
        level: 2
        status: implemented
        scope: Responses emitted by the bounded FastAPI application factory.
        owner: platform-security
        evidence: [reconforge/api/app.py]
        test_evidence: [tests/test_api_foundation.py]
        assessment: API middleware sets X-Content-Type-Options to nosniff and the health response contract verifies it.
        gap_or_limitation: This status does not cover reverse proxies, separate Studio servers, or operator-added responses.
        next_action: Retain the middleware/test and verify equivalent headers in any supported deployment profile.
      - requirement_id: v5.0.0-3.5.1
        level: 1
        status: partial
        scope: Server-rendered Studio form mutations and bearer-token API requests.
        owner: identity-security
        evidence: [reconforge/studio/app.py, reconforge/studio/components.py]
        test_evidence: [tests/test_studio_auth.py, tests/test_review_workflow.py]
        assessment: Studio mutations use per-process CSRF tokens; API authorization uses explicit bearer headers rather than cookies.
        gap_or_limitation: There is no deployed origin policy proof or complete cross-origin analysis for every browser surface.
        next_action: Document supported origins and test CSRF/CORS behavior in a deployed browser topology.

  - chapter_id: V4
    chapter_name: API and Web Service
    official_requirement_count: 16
    chapter_assessment: partial
    chapter_boundary: Selected FastAPI response/method behavior plus absent GraphQL/WebSocket surfaces; 12 remain unassessed.
    mappings:
      - requirement_id: v5.0.0-4.1.1
        level: 1
        status: partial
        scope: FastAPI JSON and error responses from current registered routes.
        owner: platform-security
        evidence: [reconforge/api/app.py, reconforge/api/errors.py]
        test_evidence: [tests/test_api_foundation.py]
        assessment: Framework responses set content types and structured errors are validated on representative routes.
        gap_or_limitation: Every response/media-type/charset combination has not been enumerated or integration-tested.
        next_action: Add an API contract inventory that checks media type and charset for every route response class.
      - requirement_id: v5.0.0-4.1.4
        level: 3
        status: partial
        scope: HTTP methods registered by the bounded FastAPI router.
        owner: platform-security
        evidence: [reconforge/api/app.py]
        test_evidence: [tests/test_api_foundation.py]
        assessment: The router exposes declared methods and rejects unsupported route-method combinations through the framework.
        gap_or_limitation: Proxy method filtering and an exhaustive allowed-method test per route are absent.
        next_action: Generate and verify an allowed-method matrix for every API route and deployment proxy.
      - requirement_id: v5.0.0-4.3.1
        level: 2
        status: not_applicable
        scope: GraphQL query processing in the assessed runtime.
        owner: platform-security
        evidence: []
        test_evidence: []
        assessment: No GraphQL endpoint, schema, or execution engine is present.
        gap_or_limitation: Adding GraphQL would create query-depth, cost, authorization, and introspection risks.
        next_action: Reassess the complete V4.3 section before introducing any GraphQL dependency or endpoint.
      - requirement_id: v5.0.0-4.4.1
        level: 1
        status: not_applicable
        scope: WebSocket connections in the assessed runtime.
        owner: platform-security
        evidence: []
        test_evidence: []
        assessment: No WebSocket route or client is present in the registered interfaces.
        gap_or_limitation: Future real-time jobs or notifications would make the WebSocket section applicable.
        next_action: Reassess V4.4 before adding WebSocket routes, libraries, or browser clients.

  - chapter_id: V5
    chapter_name: File Handling
    official_requirement_count: 13
    chapter_assessment: partial
    chapter_boundary: Selected documentation, bounded tabular and structured-document limits/type/path controls, and malware gaps only; eight remain unassessed.
    mappings:
      - requirement_id: v5.0.0-5.1.1
        level: 2
        status: partial
        scope: Inventoried CSV/XLS/XLSX/JSON/YAML and selected registry/evidence inputs.
        owner: workspace-data-owner
        evidence: [docs/security/file-ingestion-inventory.v1.yaml, docs/security/file-ingestion.md]
        test_evidence: [tests/test_file_ingestion_inventory.py, tests/test_file_ingress_security.py, tests/test_structured_ingress_security.py, tests/test_close_workflow_structured_ingress.py, tests/test_generated_manifest_structured_ingress.py, tests/test_client_pack_redaction_ingress.py, tests/test_client_pack_csv_redaction_ingress.py, tests/test_client_pack_copy_publication.py, tests/test_client_pack_publication_recovery.py, tests/test_db_backup_structured_ingress.py, tests/test_db_import_structured_ingress.py, tests/test_business_record_ingress.py, tests/test_evidence_review_csv_ingress.py, tests/test_review_state_json_ingress.py, tests/test_direct_json_ingress_inventory.py, tests/test_financial_idempotency_json.py, tests/test_generated_report_ingress.py, tests/test_studio_artifact_ingress.py]
        assessment: A closed feature-by-feature inventory records supported formats, trust, entrypoints, parser families, coverage, budgets, tests, risks, limitations, and exact direct tabular/JSON/YAML calls; FI-005 evidence/review CSV, FI-006 reports, FI-007 Studio, FI-008 business records, FI-009 DB JSON, FI-014 review-state JSON, FI-015 generated compatibility JSON, FI-016 explanation JSON, AP/AR, PostgreSQL reconciliation, SQLite matching/public export, and Redis session FI-013 JSON, and FI-012 redistribution paths have named bounded profiles.
        gap_or_limitation: Crash-atomic existing-directory client-pack replacement/recovery, legacy XLS internals, malware quarantine, source/actor authenticity, disclosure authorization, and future connector/upload behavior remain incomplete.
        next_action: Migrate every partial inventory surface and add quarantine before adding HTTP uploads or broader connectors.
      - requirement_id: v5.0.0-5.2.1
        level: 1
        status: partial
        scope: Canonical reconciliation CSV/XLS/XLSX paths plus selected configuration/workflow/client-pack, FI-005 evidence/review CSV, FI-006 reports, FI-007 Studio, FI-009 local database import/restore JSON, FI-014 review-state JSON, FI-015 generated compatibility JSON, FI-016 explanation JSON, and AP/AR, PostgreSQL reconciliation, SQLite matching/public export, and Redis session FI-013 JSON paths.
        owner: platform-security
        evidence: [reconforge/io/ingress.py, reconforge/io/structured.py, reconforge/io/records.py, reconforge/io/generated.py, reconforge/io/persisted.py, docs/security/file-ingestion-inventory.v1.yaml]
        test_evidence: [tests/test_file_ingress_security.py, tests/test_structured_ingress_security.py, tests/test_close_workflow_structured_ingress.py, tests/test_generated_manifest_structured_ingress.py, tests/test_client_pack_redaction_ingress.py, tests/test_client_pack_csv_redaction_ingress.py, tests/test_client_pack_copy_publication.py, tests/test_client_pack_publication_recovery.py, tests/test_db_backup_structured_ingress.py, tests/test_db_import_structured_ingress.py, tests/test_business_record_ingress.py, tests/test_evidence_review_csv_ingress.py, tests/test_review_state_json_ingress.py, tests/test_direct_json_ingress_inventory.py, tests/test_financial_idempotency_json.py, tests/test_generated_report_ingress.py, tests/test_studio_artifact_ingress.py, tests/test_file_ingestion_inventory.py]
        assessment: Bounded tabular paths enforce byte/shape/archive ceilings; selected JSON/YAML plus FI-005 evidence/review CSV, FI-006 reports, FI-007 Studio, FI-008 business records, FI-009 import/restore JSON, FI-014 review-state JSON, FI-015 generated compatibility JSON, FI-016 explanation JSON, and AP/AR, PostgreSQL reconciliation, SQLite matching/public export, and Redis session FI-013 JSON enforce byte/node/depth/collection/scalar ceilings; FI-012 also freezes a bounded set and stages handled-failure publication.
        gap_or_limitation: Generated-artifact consistency is not cryptographic, existing-directory replacement and the multi-file database export are not observer/crash atomic, and bounded inputs/state are not authenticated, malware-scanned, or approved for disclosure.
        next_action: Inventory and migrate each remaining partial surface through bounded structured or generated-artifact readers.
      - requirement_id: v5.0.0-5.2.2
        level: 1
        status: partial
        scope: Canonical CSV/XLS/XLSX and inherited mapping, DuckDB, and built-in adapter paths.
        owner: platform-security
        evidence: [reconforge/io/ingress.py, docs/security/file-ingestion-inventory.v1.yaml]
        test_evidence: [tests/test_file_ingress_security.py, tests/test_file_ingestion_inventory.py]
        assessment: Bounded tabular paths pair an extension allowlist with CSV anti-mismatch checks, XLS OLE magic, and XLSX ZIP/content checks before parsing.
        gap_or_limitation: Legacy XLS internals and non-tabular file types do not yet have equivalent content checks; polyglot resistance is not comprehensive.
        next_action: Add format-specific content validation to each remaining inventoried surface without trusting extension or MIME alone.
      - requirement_id: v5.0.0-5.3.2
        level: 1
        status: partial
        scope: Paths routed through the current safe-path and tenant database helpers.
        owner: platform-security
        evidence: [reconforge/utils/safe_paths.py, reconforge/db/tenancy.py]
        test_evidence: [tests/test_safe_paths.py, tests/test_tenant_isolation.py]
        assessment: Selected outputs and tenant paths reject traversal, overlap, reserved names, and boundary escape.
        gap_or_limitation: Not every legacy caller and future connector is proven to use the bounded helpers.
        next_action: Add a production path-call inventory and AST/contract gate for untrusted filenames.
      - requirement_id: v5.0.0-5.4.3
        level: 2
        status: planned
        scope: Untrusted files later served, shared, or stored as evidence artifacts.
        owner: evidence-security
        evidence: []
        test_evidence: []
        assessment: The architecture reserves a malware-scanning hook, but no scanner integration or quarantine workflow exists.
        gap_or_limitation: ReconForge cannot assert that accepted or redistributed files are free of known malicious content.
        next_action: Define a provider-neutral scan/quarantine interface and failure tests before authorized downloads.

  - chapter_id: V6
    chapter_name: Authentication
    official_requirement_count: 47
    chapter_assessment: partial
    chapter_boundary: Selected password, login-abuse, and bounded user-verified WebAuthn controls only; remaining authentication requirements, including recovery and broad MFA lifecycle coverage, remain unassessed.
    mappings:
      - requirement_id: v5.0.0-6.1.1
        level: 1
        status: partial
        scope: Local/API password login throttling documentation.
        owner: identity-security
        evidence: [docs/security/api-security.md, reconforge/api/routes/auth.py]
        test_evidence: [tests/test_api_auth.py, tests/test_redis_foundation.py]
        assessment: Login failure windows, safe messages, and optional Redis atomic counters are documented and tested.
        gap_or_limitation: Adaptive response, distributed deployment configuration, monitoring, and malicious lockout analysis are incomplete.
        next_action: Publish deployment-specific throttle policy and test distributed failure/recovery behavior.
      - requirement_id: v5.0.0-6.2.1
        level: 1
        status: planned
        scope: Local user creation and password changes.
        owner: identity-security
        evidence: []
        test_evidence: []
        assessment: Passwords must be non-empty, but the required minimum-length policy is not enforced centrally.
        gap_or_limitation: Weak short passwords can satisfy the current hash helper contract.
        next_action: Introduce a versioned password policy with compatibility/migration handling and boundary tests.
      - requirement_id: v5.0.0-6.3.1
        level: 1
        status: partial
        scope: Local and bounded server password-login endpoints.
        owner: identity-security
        evidence: [reconforge/api/routes/auth.py, reconforge/infrastructure/redis.py]
        test_evidence: [tests/test_api_auth.py, tests/test_redis_foundation.py]
        assessment: Repeated failures are rate-limited and successful authentication clears the relevant counter.
        gap_or_limitation: Multi-node effectiveness depends on configured Redis and has no current remote live-run evidence.
        next_action: Obtain live multi-worker rate-limit evidence and define alert/lockout operating procedures.
      - requirement_id: v5.0.0-6.4.3
        level: 2
        status: planned
        scope: Forgotten-password recovery for local or server users.
        owner: identity-security
        evidence: []
        test_evidence: []
        assessment: No self-service password recovery capability is implemented.
        gap_or_limitation: Operator/admin password change is not a complete secure recovery ceremony; bounded WebAuthn MFA exists but recovery and lifecycle governance remain absent.
        next_action: Design recovery only with identity proof, token lifetime/replay controls, audit, and MFA compatibility.

  - chapter_id: V7
    chapter_name: Session Management
    official_requirement_count: 19
    chapter_assessment: partial
    chapter_boundary: Selected backend verification, token generation, and termination requirements only; 16 remain unassessed.
    mappings:
      - requirement_id: v5.0.0-7.2.1
        level: 1
        status: implemented
        scope: Opaque local API and bounded PostgreSQL server session tokens.
        owner: identity-security
        evidence: [reconforge/api/security.py, reconforge/infrastructure/postgres_identity.py]
        test_evidence: [tests/test_api_auth.py, tests/test_api_server_identity.py]
        assessment: Session verification occurs at the trusted backend and binds active user/principal state before protected routes.
        gap_or_limitation: This does not cover OAuth/OIDC, browser cookie sessions, external IdPs, or public deployment topology.
        next_action: Retain backend-only verification and reassess when adding any new session mechanism.
      - requirement_id: v5.0.0-7.2.3
        level: 1
        status: partial
        scope: Opaque reference tokens generated by local and PostgreSQL identity services.
        owner: identity-security
        evidence: [reconforge/api/security.py, reconforge/infrastructure/postgres_identity.py]
        test_evidence: [tests/test_api_auth.py, tests/test_postgres_identity.py]
        assessment: Tokens use the standard secrets CSPRNG, return raw material once, and store only hashes.
        gap_or_limitation: A dedicated test does not currently assert the standard's entropy and collision boundary.
        next_action: Add token entropy/length/uniqueness and rotation contracts without logging raw tokens.
      - requirement_id: v5.0.0-7.4.1
        level: 1
        status: implemented
        scope: Explicit logout and expired/revoked local or bounded server opaque sessions.
        owner: identity-security
        evidence: [reconforge/api/security.py, reconforge/infrastructure/postgres_identity.py]
        test_evidence: [tests/test_api_auth.py, tests/test_api_server_identity.py]
        assessment: Logout revokes session state and subsequent verification rejects expired, disabled, or revoked sessions.
        gap_or_limitation: Client-side token deletion and distributed cache propagation remain deployment/client responsibilities.
        next_action: Preserve revocation tests and add active-session management before claiming broader session lifecycle coverage.

  - chapter_id: V8
    chapter_name: Authorization
    official_requirement_count: 13
    chapter_assessment: partial
    chapter_boundary: Selected function, object/tenant, and trusted-service enforcement only; 10 remain unassessed.
    mappings:
      - requirement_id: v5.0.0-8.1.1
        level: 1
        status: partial
        scope: Registered permissions, API dependencies, module actions, and documented roles.
        owner: identity-security
        evidence: [reconforge/auth/policy.py, reconforge/api/dependencies.py]
        test_evidence: [tests/test_auth_rbac.py, tests/test_policy_engine.py]
        assessment: Named function permissions and selected object/action policies are explicit and deny missing permission.
        gap_or_limitation: Field, amount, entity, period, region, and data-class ABAC documentation is incomplete.
        next_action: Complete the centralized authorization matrix and generated deny-by-default tests.
      - requirement_id: v5.0.0-8.2.2
        level: 1
        status: partial
        scope: Tenant-scoped server repositories and selected object-action routes.
        owner: platform-security
        evidence: [reconforge/db/tenancy.py, reconforge/infrastructure/postgres.py]
        test_evidence: [tests/test_tenant_isolation.py, tests/test_api_dependencies.py]
        assessment: Tenant identifiers/paths and selected PostgreSQL contexts are bound before data access.
        gap_or_limitation: Full domain repository migration and live cross-service object-level isolation are absent.
        next_action: Add per-route resource ownership tests and current live RLS evidence for every server repository.
      - requirement_id: v5.0.0-8.3.1
        level: 1
        status: partial
        scope: FastAPI permission dependencies and application-service policy checks.
        owner: identity-security
        evidence: [reconforge/api/dependencies.py, reconforge/auth/policy.py]
        test_evidence: [tests/test_api_foundation.py, tests/test_policy_engine.py]
        assessment: Authorization is evaluated in backend code and does not rely on client-side controls.
        gap_or_limitation: Trusted-local compatibility and scattered legacy checks prevent a universal service-layer claim.
        next_action: Route every sensitive use case through the central policy boundary and test all permission/action pairs.

  - chapter_id: V9
    chapter_name: Self-contained Tokens
    official_requirement_count: 7
    chapter_assessment: not_applicable
    chapter_boundary: Current sessions are opaque reference tokens; all seven self-contained-token requirements require reassessment if JWT/PASETO is added.
    mappings:
      - requirement_id: v5.0.0-9.1.1
        level: 1
        status: not_applicable
        scope: JWT, PASETO, or other self-contained authentication/authorization tokens.
        owner: identity-security
        evidence: []
        test_evidence: []
        assessment: The assessed identity implementations use server-stored opaque token hashes, not trusted client-contained claims.
        gap_or_limitation: Any self-contained token would add algorithm, key source, audience, time, type, and replay requirements.
        next_action: Reassess the entire V9 chapter before introducing self-contained security tokens.

  - chapter_id: V10
    chapter_name: OAuth and OIDC
    official_requirement_count: 36
    chapter_assessment: not_applicable
    chapter_boundary: OAuth authorization/resource-server and OIDC client/provider roles are not implemented; all 36 requirements are conditionally unassessed.
    mappings:
