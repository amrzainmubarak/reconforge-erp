    policy_coverage: complete
    status: bounded
    controls: [SEC-C-001, SEC-C-002]
    test_evidence: [tests/test_business_record_ingress.py, tests/test_finance_core.py, tests/test_inventory_core.py, tests/test_platform_controls_matching_exceptions.py, tests/test_receivables_cli.py]
    residual_risk_ids: [R-018]
    limitations:
      - "business-record-ingress-v1 applies 67108864 bytes/file, 250000 records, 512 fields/record, 10000000 cells, and 128000 characters/field. JSON additionally caps 2000000 nodes and depth 32, preserves fractional/exponent lexemes, and rejects duplicate/non-finite/ambiguous/non-object input; CSV receives strict UTF-8, shape, header, and tabular preflight."
      - Stable pre/post-parse SHA-256 and byte counts reject reparse/non-regular or changed files. Account, control, intercompany, and journal audit/outbox evidence uses the parsed-byte digest/size/profile rather than re-reading provenance after parsing.
      - The generic reader retains direct-list, one recognized envelope, and historical single-object compatibility. Domain validation remains service-specific; hashes are unkeyed and do not authenticate origin, authorize an actor, classify free text, or prove malware absence.
    next_action: Add source authentication/classification and malware quarantine at a separately reviewed boundary; reassess this bounded parser status if another business-record parser or upload surface is introduced.
  - id: FI-009
    name: Local database import and restore artifacts
    module_ids: [platform.core]
    trust: untrusted-local
    entrypoints:
      - reconforge/db/importers.py::_read_json
      - reconforge/db/backup.py::_read_json_file
    formats: [json]
    parser_families: [json-stdlib]
    policy_coverage: complete
    status: bounded
    controls: [SEC-C-001, SEC-C-002, SEC-C-007]
    test_evidence: [tests/test_db_export_import.py, tests/test_db_import_structured_ingress.py, tests/test_db_backup_restore.py, tests/test_db_backup_structured_ingress.py]
    residual_risk_ids: [R-018]
    limitations:
      - "Backup/manifest restore JSON uses the shared structured-document engine with the database-backup-json-ingress-v1 profile: 67108864 bytes per file, 1000000 nodes, depth 64, 250000 items per collection, and 8388608 characters per scalar. Duplicate/non-finite/invalid-encoding input, reparse points, changes during validation, unknown top-level/table keys, and manifest checksum/size/schema mismatches fail before restore temporary-file creation or target mutation."
      - Runtime validation permits missing known tables for historical schema-v1 additive compatibility but rejects unknown tables. The two published schemas describe current writer output; hashes remain unkeyed and do not authenticate origin or authorize restore.
      - "Legacy account-reconciliation/control-test DB imports use database-legacy-import-json-ingress-v1: 16777216 bytes per file, 500000 nodes, depth 32, 50000 items per collection, and 1048576 characters per scalar. Stable pre/post-read fingerprints, duplicate/non-finite/invalid-encoding and reparse rejection, unambiguous list/envelope/keyed-map validation, and parsed-byte digest/size provenance apply before database inspection or mutation."
      - No archive input is accepted. The bounded import schemas retain permissive legacy record fields; neither import nor restore authenticates origin, authorizes the actor centrally, scans malware, encrypts files, or proves DR recovery.
    next_action: Design centralized restore/import authorization, encryption/key management, malware hooks, and real backup/restore/DR exercises; reassess this bounded status if another parser or archive format is introduced.
  - id: FI-010
