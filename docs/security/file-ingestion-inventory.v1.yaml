      - reconforge/mappings/inspector.py::_load_mapping
      - reconforge/mappings/validator.py::_read_yaml
      - reconforge/rules/loader.py::_read_yaml
      - reconforge/rules/recon_as_code.py::ReconciliationAsCodeSpec.from_yaml
    formats: [yaml]
    parser_families: [pyyaml]
    policy_coverage: complete
    status: bounded
    controls: [SEC-C-001, SEC-C-002]
    test_evidence:
      - tests/test_structured_ingress_security.py
      - tests/test_config_financial_input_policy.py
      - tests/test_mapping_validation_cli.py
      - tests/test_rules_engine.py
