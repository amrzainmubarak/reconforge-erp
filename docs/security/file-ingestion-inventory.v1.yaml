      - The boundary limits bytes, nodes, depth, collection width, scalar size, and aliases and rejects duplicate keys, merges, cycles, multiple documents, unsafe tags, and non-finite legacy values.
      - These structural controls do not authenticate configuration authors or prove that accepted rules and mappings are financially correct.
    next_action: Preserve the exact direct-parser allowlist and add signed approved-pack provenance only through a separately reviewed release workflow.
  - id: FI-011
