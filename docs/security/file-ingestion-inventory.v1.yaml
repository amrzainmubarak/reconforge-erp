schema_version: 1
inventory_id: reconforge-file-ingestion
reviewed_on: "2026-08-01"
owner: platform-security
claim_boundary: >-
  This inventory proves repository-visible parser coverage and bounded controls only. It does not prove
  that files are authentic or malware-free, does not cover future connectors, and does not authorize
  redistribution of accepted content. Partial surfaces remain untrusted and must not be described as secure uploads.
tabular_policy:
  id: tabular-file-ingress-v1
  implementation: reconforge/io/ingress.py
  accepted_extensions: [.csv, .xls, .xlsx]
  max_file_bytes: 67108864
  max_rows: 1000000
  max_columns: 2048
  max_cells: 20000000
  max_csv_field_characters: 128000
  max_archive_members: 4096
  max_archive_member_bytes: 134217728
  max_archive_uncompressed_bytes: 268435456
  max_archive_compression_ratio: 1000
structured_document_policy:
  id: structured-document-ingress-v1
  implementation: reconforge/io/structured.py
  accepted_extensions: [.json, .yaml, .yml]
  max_file_bytes: 8388608
  max_nodes: 200000
  max_depth: 64
  max_collection_items: 100000
  max_scalar_characters: 1000000
  max_yaml_aliases: 64
persisted_json_policies:
  - id: financial-idempotency-json-v1
    implementation: reconforge/io/persisted.py
    schema_id: financial-idempotency-response-object-v1
    schema_path: docs/schemas/financial_idempotency_response.schema.json
    max_utf8_bytes: 4194304
    max_nodes: 100000
    max_depth: 32
    max_collection_items: 25000
    max_scalar_characters: 262144
    unique_keys: true
    object_root: true
    integer_number_tokens_only: true
    canonical_producer_text: true
surfaces:
  - id: FI-001
    name: Canonical reconciliation tabular reader
    module_ids: [reconciliation.core]
    trust: untrusted-local
    entrypoints:
      - reconforge/io/readers.py::read_table
      - reconforge/io/ingress.py::validate_tabular_input
    formats: [csv, xls, xlsx]
    parser_families: [csv-stdlib, openpyxl, pandas]
    policy_coverage: complete
    status: bounded
    controls: [SEC-C-001, SEC-C-002]
    test_evidence: [tests/test_file_ingress_security.py, tests/test_readers.py]
    residual_risk_ids: [R-018]
    limitations:
      - Legacy XLS receives size and OLE-signature checks but not workbook-internal active-content inspection.
      - The policy rejects XLSX formulas and external relationships but does not establish malware absence or source authenticity.
    next_action: Replace or sandbox legacy XLS parsing and connect a provider-neutral malware scan and quarantine boundary.
  - id: FI-002
    name: DuckDB direct reconciliation scans
    module_ids: [reconciliation.core]
    trust: untrusted-local
    entrypoints:
      - reconforge/engines/duckdb_engine.py::DuckDBEngine.iter_dataset_batches
      - reconforge/engines/duckdb_engine.py::DuckDBEngine._register_dataset
    formats: [csv, xls, xlsx]
    parser_families: [duckdb, pandas]
    policy_coverage: complete
    status: bounded
    controls: [SEC-C-001, SEC-C-002]
    test_evidence: [tests/test_file_ingress_security.py, tests/test_generator_benchmark_engines.py]
    residual_risk_ids: [R-018]
    limitations:
      - CSV is preflighted before DuckDB receives the path, but parser-library vulnerabilities remain a dependency risk.
    next_action: Retain the preflight contract gate and add memory-constrained adversarial DuckDB parser runs in CI.
  - id: FI-003
    name: Mapping header inspection
    module_ids: [mapping.profiles]
    trust: untrusted-local
    entrypoints: [reconforge/mappings/inspector.py::_read_headers]
    formats: [csv, xls, xlsx]
    parser_families: [pandas]
    policy_coverage: complete
    status: bounded
    controls: [SEC-C-001, SEC-C-002]
    test_evidence: [tests/test_file_ingress_security.py, tests/test_mapping_wizard.py]
    residual_risk_ids: [R-018]
    limitations:
      - Header inspection does not authenticate the export or prove that the mapped business meaning is correct.
    next_action: Preserve the centralized reader route and add signed source-profile support only with a reviewed connector contract.
  - id: FI-004
    name: Built-in generic CSV adapter
    module_ids: [plugins.export]
    trust: untrusted-local
    entrypoints: [reconforge/plugins/generic_csv.py::GenericCSVConnector.load_data]
    formats: [csv]
    parser_families: [pandas]
    policy_coverage: complete
    status: bounded
    controls: [SEC-C-001, SEC-C-002]
    test_evidence: [tests/test_file_ingress_security.py, tests/test_v03_platform.py]
    residual_risk_ids: [R-018]
    limitations:
      - The built-in adapter is local and read-only; it provides neither export-origin authentication nor malware assurance.
    next_action: Keep arbitrary plugin loading disabled and require the same preflight contract for every future tabular connector.
  - id: FI-005
    name: Evidence and review CSV assembly
    module_ids: [reconciliation.core]
    trust: generated-local
    entrypoints:
      - reconforge/evidence/binder.py::_read_csv_if_exists
      - reconforge/review/state.py::collect_exception_frame
    formats: [csv]
    parser_families: [pandas]
    policy_coverage: complete
    status: bounded
    controls: [SEC-C-001, SEC-C-006]
    test_evidence: [tests/test_evidence_review_csv_ingress.py, tests/test_evidence_binder_financial_input_policy.py, tests/test_period_financial_input_policy.py, tests/test_review_workflow.py]
    residual_risk_ids: [R-018]
    limitations:
      - "generated-artifact-ingress-v1 applies 67108864 bytes/file, 250000 rows, 512 columns, 10000000 cells, and 128000 characters/field with strict encoding, shape, and header checks."
      - Strict financial paths select exact-text representation; legacy compatibility retains display inference. Evidence generation caches each selected CSV document once and its v3 fingerprint uses the exact parsed checksum/size with a final stable-byte verification.
      - Generated CSV fingerprints are unkeyed and do not authenticate producer identity, schema authorization, disclosure approval, classification, or malware status. Adjacent review-state JSON is bounded separately by FI-014.
    next_action: Add authenticated producer/schema manifests without weakening bounded legacy compatibility.
  - id: FI-006
    name: Variance and management artifact readers
    module_ids: [reconciliation.core]
    trust: generated-local
    entrypoints:
      - reconforge/variance.py::_extract_csv_metrics
      - reconforge/variance.py::_extract_json_metrics
      - reconforge/reports/management_pack.py::_json_payload
    formats: [csv, json]
    parser_families: [json-stdlib, pandas]
    policy_coverage: complete
    status: bounded
    controls: [SEC-C-001, SEC-C-006]
    test_evidence: [tests/test_generated_report_ingress.py, tests/test_reports.py, tests/test_variance_analysis.py]
    residual_risk_ids: [R-018]
    limitations:
      - "generated-artifact-ingress-v1 applies 67108864 bytes/file, 250000 CSV rows, 512 columns, 10000000 cells, and 128000 characters/CSV field. JSON additionally caps 1000000 nodes, depth 64, 250000 items/collection, and 1000000 characters/scalar while rejecting duplicates and non-finite values."
      - Stable pre/post-parse SHA-256 and byte counts reject reparse/non-regular or changed files. Variance CSV values use exact-text mode; JSON fractional/exponent lexemes remain exact strings.
      - These generated artifacts are not yet cryptographically bound to producer manifests, signed releases, or an authenticated workspace identity.
    next_action: Add producer-manifest authentication and schema/version binding without weakening bounded legacy compatibility.
  - id: FI-007
    name: Current local Studio artifact readers
    module_ids: [reconciliation.core]
    trust: generated-local
    entrypoints:
      - reconforge/studio/app.py::create_studio_app
      - reconforge/studio/data.py::_read_generated_csv
      - reconforge/studio/data.py::_json_payload
    formats: [csv, json]
    parser_families: [json-stdlib, pandas]
    policy_coverage: complete
    status: bounded
    controls: [SEC-C-001, SEC-C-006]
    test_evidence: [tests/test_studio_artifact_ingress.py, tests/test_studio_data.py, tests/test_studio_platform_pages.py, tests/test_studio_auth.py]
    residual_risk_ids: [R-018]
    limitations:
      - "generated-artifact-ingress-v1 applies 67108864 bytes/file, 250000 CSV rows, 512 columns, 10000000 cells, and 128000 characters/CSV field. JSON additionally caps 1000000 nodes, depth 64, 250000 items/collection, and 1000000 characters/scalar while rejecting duplicates and non-finite values."
      - Stable pre/post-parse SHA-256 and byte counts reject reparse/non-regular or changed files. CSV retains pandas keep_default_na=False display typing and rejects blank/duplicate headers. JSON fractional/exponent lexemes remain exact strings.
      - When a generated CSV companion JSON exists, Studio requires the named collection to contain the same row count and only columns present in the CSV. This is consistency evidence, not a cryptographic CSV-to-companion binding; legacy CSV-only output remains readable.
      - Studio still trusts the operator-selected local directory. Unkeyed hashes do not authenticate producer/source, authorize disclosure, classify fields, scan malware, or prove supported throughput.
    next_action: Add producer-signed or manifest-digested CSV bindings and disclosure/classification/malware controls before treating generated artifacts as authenticated evidence.
  - id: FI-008
    name: Platform business record imports
    module_ids: [finance.controls, finance.core, inventory.core, reconciliation.core]
    trust: untrusted-local
    entrypoints:
      - reconforge/platform/common.py::read_local_records
      - reconforge/cli.py::_ledger_lines_from_json
      - reconforge/cli.py::_inventory_lines_from_json
      - reconforge/cli.py::_receivables_json_records
