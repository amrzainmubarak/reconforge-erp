    next_action: Preserve the bounded reader contract and add authenticated template provenance only through a separately reviewed workflow.
  - id: FI-012
    name: Client pack bounded copy/redaction and generated manifest readers
    module_ids: [reconciliation.core]
    trust: generated-local
    entrypoints:
      - reconforge/reports/client_pack.py::_redact_csv_file
      - reconforge/reports/client_pack.py::_redact_json_file
      - reconforge/reports/client_pack.py::_redact_text_file
      - reconforge/reports/client_pack.py::_copy_bounded_file
      - reconforge/reports/client_pack.py::generate_client_pack
      - reconforge/reports/client_pack.py::recover_client_pack_publication
      - reconforge/reports/client_pack.py::read_client_pack_manifest
      - reconforge/evidence/binder.py::read_evidence_index
    formats: [csv, json, text]
    parser_families: [csv-stdlib, json-stdlib]
    policy_coverage: partial
    status: partial
    controls: [SEC-C-002, SEC-C-006, SEC-C-009]
    test_evidence:
      - tests/test_client_pack_csv_redaction_ingress.py
      - tests/test_client_pack_copy_publication.py
      - tests/test_client_pack_publication_recovery.py
      - tests/test_client_pack_financial_input_policy.py
      - tests/test_client_pack_redaction_ingress.py
      - tests/test_evidence_binder_financial_input_policy.py
      - tests/test_generated_manifest_structured_ingress.py
    residual_risk_ids: [R-014, R-017, R-018]
    limitations:
      - Manifest/JSON redaction inherit structured-document limits; CSV redaction inherits tabular limits and rejects duplicate headers. Selected text/non-redacted copies are regular non-symlink files bounded to 10000 files, 20000 traversed entries, 67108864 bytes each, and 536870912 aggregate bytes; strict UTF-8 text streams with a 1048576-character line ceiling.
      - The selected file set is frozen before fingerprinting. The complete pack is built and rechecked in a sibling staging directory; handled generation/publication failure preserves or restores the prior destination, and successful replacement removes stale hidden content.
      - Fresh-directory publication is one same-filesystem rename. Replacing an existing non-empty directory on Windows remains non-observer-atomic and non-crash-atomic, but a closed schema-v1 marker binds exact sibling basenames plus bounded previous/staged tree digests and the explicit recovery command handles four allowlisted filesystem states.
      - Recovery refuses missing/multiple/tampered markers, changed trees, reparse points, unexpected siblings, and ambiguous states. Marker SHA-256 is self-consistency only, not authentication; file fsync does not guarantee parent-directory durability on every filesystem or host-loss mode.
      - Bounded bytes and handled-failure rollback do not provide authenticated provenance, disclosure authorization, malware quarantine, redaction completeness, or safe-redistribution assurance.
    next_action: Bind copied artifacts to separately authenticated scan/provenance and disclosure-approval metadata, test real process/host/filesystem durability, and refuse unscanned redistribution where policy requires scanning.
  - id: FI-013
    name: Internal persisted JSON fields
    module_ids: [platform.core, finance.controls, reconciliation.core]
    trust: internal-persisted
    entrypoints:
      - reconforge/audit/events.py::_metadata_from_json
      - reconforge/db/exporter.py::_json_rows
      - reconforge/infrastructure/postgres_ledger.py::PostgresLedgerRepository.list_audit_events
      - reconforge/infrastructure/postgres_ledger.py::PostgresLedgerRepository.verify_audit_events
      - reconforge/infrastructure/postgres_outbox.py::_metadata
      - reconforge/infrastructure/redis.py::TenantRedisStore.get_session
      - reconforge/infrastructure/sqlite_matching.py::SQLiteMatchingRepository._matching_rule_document
      - reconforge/infrastructure/sqlite_payables.py::SQLitePayablesRepository._idempotent
      - reconforge/infrastructure/sqlite_receivables.py::SQLiteReceivablesRepository._idempotent
    formats: [json]
    parser_families: [json-stdlib]
    policy_coverage: partial
    status: partial
    controls: [SEC-C-002, SEC-C-004, SEC-C-005]
    test_evidence: [tests/test_audit_metadata_json.py, tests/test_postgres_outbox_payload_json.py, tests/test_postgres_reconciliation_persisted_json.py, tests/test_sqlite_matching_rule_json.py, tests/test_redis_session_json.py, tests/test_db_export_persisted_json.py, tests/test_audit_events.py, tests/test_db_export_import.py, tests/test_postgres_ledger.py, tests/test_postgres_outbox.py, tests/test_postgres_reconciliation.py, tests/test_redis_foundation.py, tests/test_payables.py, tests/test_receivables.py, tests/test_financial_idempotency_json.py]
    residual_risk_ids: [R-018]
    limitations:
      - These are database, cache, or event values rather than filesystem ingress and must not be described as accepted upload paths.
      - "AP/AR idempotency responses use financial-idempotency-json-v1: 4194304 UTF-8 bytes, 100000 nodes, depth 32, 25000 items/collection, 262144 characters/scalar, unique keys, object root, integer-only JSON number tokens, and canonical producer text. Producer rejection rolls back the enclosing mutation; corrupt replay rejects before a new business effect."
      - "SQLite/PostgreSQL audit metadata use audit-metadata-json-v1: 4194304 UTF-8 bytes, 100000 nodes, depth 32, 25000 items/collection, 262144 characters/scalar, unique keys, finite JSON values, object root, and canonical producer text. SQLite hashes exact stored text; PostgreSQL verification reconstructs the historical canonical producer text after JSONB rendering. Invalid metadata independently fails verification, list, and audit export instead of becoming a plausible sentinel object."
      - "PostgreSQL outbox payloads use postgres-outbox-payload-json-v1 with the same ceilings, unique keys, finite object values, canonical producer/publisher text, and five producer-family wrappers. Invalid stored payloads roll back claims before an external publisher receives an event; event IDs, leases, retries, and valid JSONB shapes remain unchanged."
      - "PostgreSQL reconciliation rule, input-attribute, decision-lineage, and exception-evidence JSONB use four named profiles over postgres-reconciliation-object-v1. Rule/lineage/evidence allow 4194304 UTF-8 bytes; attributes preserve the existing 100000-byte producer ceiling."
      - "All reconciliation JSONB profiles allow 100000 nodes, depth 32, 25000 items/collection, unique keys, and finite object values. Attributes allow 100000 and the other profiles 262144 characters/scalar. Canonical bytes preserve JSONB fingerprints; corrupt rows fail before matcher use or public return instead of becoming sentinel values."
      - "SQLite matching rules use sqlite-matching-rule-json-v1: 4194304 UTF-8 bytes, 100000 nodes, depth 32, 25000 items/collection, 262144 characters/scalar, unique keys, finite object values, and historical spaced sorted ASCII text. New producers reject binary floats; historical finite floats remain readable."
      - "Tenant-scoped Redis sessions use redis-session-json-v1: 16384 UTF-8 bytes, 16 nodes, depth 2, four fields, and 256 characters/scalar. The closed schema requires string IDs, a lowercase SHA-256 token digest, and explicit UTC expiry; producer rejection precedes client access and corrupt reads do not mutate Redis."
      - "The public SQLite export has an exact five-field registry: audit metadata and both matching rules reuse their established profiles; legacy summaries use sqlite-legacy-import-summary-json-v1; matching lineage uses sqlite-matching-lineage-json-v1. All use finite unique-key object JSON and explicit 4194304-byte/100000-node/depth-32/25000-item/262144-character ceilings."
      - "Legacy-summary and matching-lineage producers use their respective contracts. Export preflights every registered row before creating the destination or writing any file, rejects non-text/corrupt values without sentinels, preserves metadata/summary/rule object outputs, and retains lineage_json as its historical string field."
      - Stored values and source artifacts are not authenticated; actor/disclosure authorization, malware quarantine, full business-semantic schemas, and supported-throughput evidence remain outside this structural boundary.
    next_action: Add authenticated producer/source provenance and centralized actor/disclosure authorization, then exercise bounded persisted-state profiles at declared throughput and live-service boundaries.
  - id: FI-014
