schema_version: 1
mapping_id: reconforge-nist-ssdf-1.1
status: evidence-bounded
last_reviewed: "2026-07-25"
claim_boundary: >-
  This all-task repository mapping is not an organizational SSDF conformance
  assessment, certification, independent review, deployment assessment, or
  proof that a secure software development process operates continuously. A
  partial status identifies bounded files and tests but does not satisfy the
  full NIST task. Planned is not implementation evidence, and no task is
  promoted to implemented-bounded by this review.

standard:
  publication: NIST SP 800-218
  ssdf_version: "1.1"
  publication_status: final
  published: "2022-02-03"
  verified_at: "2026-07-25"
  official_publication_url: https://csrc.nist.gov/pubs/sp/800/218/final
  doi_url: https://doi.org/10.6028/NIST.SP.800-218
  pdf:
    url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-218.pdf
    sha256: 617746e553a9e2da49bfbd4eef0dfc3094758a39b869314e4173ac36605cde22
    bytes: 739891
  official_table:
    url: https://csrc.nist.gov/files/pubs/sp/800/218/final/docs/nist.sp.800-218.ssdf-table.xlsx
    sha256: f5729c4c6c792cbf6cfbea74eee7cc84c579b2109006fe3cbfa8934eb460bd55
    bytes: 50039
  official_counts:
    groups: 4
    practices: 19
    tasks: 42
  source_note: >-
    Identifiers, group/practice names, and counts were reviewed from the official
    NIST PDF and Excel table in memory; the source files and task prose are not
    copied into this repository.
  excluded_draft:
    publication: NIST SP 800-218 Rev. 1
    ssdf_version: "1.2"
    status: initial-public-draft
    published: "2025-12-17"
    url: https://csrc.nist.gov/pubs/sp/800/218/r1/ipd
    reason: >-
      NIST lists version 1.2 as an Initial Public Draft, so it is monitored but
      excluded from this final-publication mapping.
  supplemental_profile:
    publication: NIST SP 800-218A
    status: final
    published: "2024-07-26"
    url: https://csrc.nist.gov/pubs/sp/800/218/a/final
    applicability: >-
      A separate profile assessment is required before promoting any generative
      AI model or model-backed system capability; it is not silently treated as
      covered or not applicable by this core SSDF 1.1 mapping.

assessment_scope:
  target: ReconForge repository artifacts and the measured dirty worktree only.
  coverage_type: all-task-repository-evidence
  method:
    - Cover every one of the 42 final SSDF 1.1 task identifiers exactly once.
    - Link only existing repository files and tests as bounded evidence.
    - Record accountable roles from Security Architecture v2 and explicit gaps.
    - Reassess on a fixed cadence and on material source or product changes.
  excluded_assurance:
    - No organizational interviews, personnel training records, or management attestation.
    - No branch-protection, production, release-signing, or artifact-retention operating evidence.
    - No independent audit, penetration test, legal conclusion, or compliance certification.
    - No SP 800-218A community-profile assessment for AI model-backed capabilities.

status_definitions:
  implemented_bounded: Full task outcome is proven only within an explicitly limited repository boundary; none received this status.
  partial: Repository evidence addresses part of the task while named process, deployment, or operating-evidence gaps remain.
  planned: No sufficient positive repository evidence supports the task outcome; the recorded action is future work.
  not_applicable: A conditional scope exclusion with a reassessment trigger; no core SSDF 1.1 task received this status.

review:
  owner: release-security
  cadence_days: 90
  next_review_due: "2026-10-23"
  triggers:
    - NIST publishes a final successor to SSDF 1.1.
    - Release, build, dependency, vulnerability-response, or source-control policy changes.
    - A model-backed AI capability is enabled or promoted beyond an offline placeholder.
    - A material security incident or high-severity vulnerability affects the project.

summary:
  official_group_count: 4
  official_practice_count: 19
  official_task_count: 42
  status_counts:
    implemented_bounded: 0
    partial: 28
    planned: 14
    not_applicable: 0

