schema_version: 2
architecture_id: reconforge-security-architecture
status: evidence-bounded
last_reviewed: "2026-07-26"
claim_boundary: >-
  This registry describes implemented or partial repository controls and explicit
  deployment responsibilities. It is not a compliance certification, security
  guarantee, penetration-test result, audit opinion, or production-readiness claim.

control_owners:
  - id: platform-security
    responsibility: Tenant, request, dependency, and deployment trust boundaries.
    accountability_boundary: Repository design and tests; operators own deployment configuration and access.
  - id: identity-security
    responsibility: Authentication, session, principal binding, authorization, and segregation of duties.
    accountability_boundary: Implemented local and bounded server paths only; federation and MFA are absent.
  - id: financial-integrity
    responsibility: Exact financial input, data-quality, and deterministic decision controls.
    accountability_boundary: Declared current paths only; public legacy readers remain migration surfaces.
  - id: domain-integrity
    responsibility: Atomic business mutation, audit, and outbox evidence contracts.
    accountability_boundary: Migrated services only; legacy mutation coverage remains incomplete.
  - id: evidence-security
    responsibility: Evidence metadata, checksums, retention metadata, redaction boundaries, and artifact handling.
    accountability_boundary: Local artifacts and bounded metadata adapters; authenticity and central delivery are absent.
  - id: release-security
    responsibility: CI, dependency, artifact, container, SBOM, and provenance gates.
    accountability_boundary: Repository workflow definitions; clean release execution and signing remain open.
  - id: workspace-data-owner
    responsibility: Input authorization, classification, retention, backup protection, and disclosure approval.
    accountability_boundary: Operator-controlled workspaces and data; ReconForge cannot infer disclosure authority.

editions:
  - id: community-local
    maturity: implemented-bounded
    deployment_model: Single trusted operator or trusted local team using SQLite and local files.
    default_network: No mandatory runtime network call or telemetry in core file workflows.
    trust_boundaries: [TB-001, TB-002, TB-003, TB-006, TB-007]
    data_classes: [DC-001, DC-002, DC-003, DC-004, DC-005, DC-006]
    enforced_controls: [SEC-C-001, SEC-C-002, SEC-C-003, SEC-C-005, SEC-C-006, SEC-C-007, SEC-C-008]
    limitations:
      - The local operating-system account and filesystem are trusted deployment dependencies.
      - Trusted local CLI compatibility is not an enterprise principal or complete SoD boundary.
  - id: team-server
    maturity: experimental-bounded
    deployment_model: Explicit server profile using bounded PostgreSQL identity/domain repositories with optional Redis and S3-compatible adapters.
    default_network: Network dependencies are explicit operator configuration; TLS defaults do not prove secure deployment.
    trust_boundaries: [TB-001, TB-002, TB-003, TB-004, TB-005, TB-006, TB-007]
    data_classes: [DC-001, DC-002, DC-003, DC-004, DC-005, DC-006]
    enforced_controls: [SEC-C-001, SEC-C-002, SEC-C-003, SEC-C-004, SEC-C-005, SEC-C-006, SEC-C-007, SEC-C-008, SEC-C-009, SEC-C-010]
    limitations:
      - Most domain persistence is not covered by one end-to-end PostgreSQL/Redis/object-storage isolation proof.
      - OIDC, SAML, SCIM, MFA, malware scanning, and managed external event delivery are absent.
  - id: regulated
    maturity: planned-only
    deployment_model: Customer-controlled on-premises or air-gapped profile with customer-managed keys, WORM evidence, HA, and DR.
    default_network: No supported regulated deployment package exists.
    trust_boundaries: [TB-001, TB-002, TB-003, TB-004, TB-005, TB-006, TB-007]
    data_classes: [DC-001, DC-002, DC-003, DC-004, DC-005, DC-006]
    enforced_controls: []
    limitations:
      - Air-gap installation, key management, WORM enforcement, HA/DR, privileged access, and independent validation are not implemented.
      - No regulatory, banking, certification, or compliance claim is allowed.

data_classes:
  - id: DC-001
    name: public-synthetic
    sensitivity: public
    owner: workspace-data-owner
    examples: [Published documentation, explicitly marked synthetic fixtures, public schemas]
    required_controls: [SEC-C-001, SEC-C-008]
    handling_rules:
      - Public classification must be explicit; generated output is not public by default.
  - id: DC-002
    name: internal-configuration
    sensitivity: internal
    owner: workspace-data-owner
    examples: [Mappings, rule packs, deployment configuration without secrets, module manifests]
    required_controls: [SEC-C-001, SEC-C-002, SEC-C-008]
    handling_rules:
      - Validate schemas and paths; keep credentials outside committed configuration.
  - id: DC-003
    name: financial-sensitive
    sensitivity: confidential
    owner: workspace-data-owner
    examples: [ERP exports, normalized records, amounts, balances, exceptions, review notes]
    required_controls: [SEC-C-001, SEC-C-002, SEC-C-005, SEC-C-006, SEC-C-007]
    handling_rules:
      - Store only in authorized local or explicitly configured tenant-scoped locations.
      - Do not include raw financial rows in logs or public support material by default.
  - id: DC-004
    name: identity-restricted
    sensitivity: restricted
    owner: identity-security
    examples: [User records, password verifier material, roles, permissions, session metadata]
    required_controls: [SEC-C-003, SEC-C-004, SEC-C-007, SEC-C-008]
    handling_rules:
      - Never export raw passwords or bearer tokens; protect backups containing verifier material.
  - id: DC-005
    name: security-audit-sensitive
    sensitivity: restricted
    owner: domain-integrity
    examples: [Audit events, outbox records, request metadata, evidence checksums, verification state]
    required_controls: [SEC-C-004, SEC-C-005, SEC-C-006, SEC-C-007]
    handling_rules:
      - Preserve integrity/lineage metadata and restrict access; hashes are not signatures.
  - id: DC-006
    name: secret
    sensitivity: secret
    owner: platform-security
    examples: [Database DSNs, API bearer tokens, object-store credentials, signing or encryption keys]
    required_controls: [SEC-C-003, SEC-C-004, SEC-C-008, SEC-C-009]
    handling_rules:
      - Supply through deployment secret mechanisms or process environment, never fixtures, docs, logs, or repository configuration.

trust_boundaries:
  - id: TB-001
    name: untrusted-file-ingress
    source: User-selected files and archives outside ReconForge validation.
    destination: Local readers, mapping, validation, normalization, and report workflows.
    assets: [DC-002, DC-003]
    threats: [Malformed values, path traversal, unsafe YAML tags, formula or parser abuse, silent numeric coercion]
    controls: [SEC-C-001, SEC-C-002]
    evidence:
      - docs/security/file-ingestion-inventory.v1.yaml
      - reconforge/io/ingress.py
      - reconforge/io/structured.py
      - reconforge/utils/safe_paths.py
      - reconforge/utils/yaml.py
      - tests/test_file_ingress_security.py
      - tests/test_file_ingestion_inventory.py
      - tests/test_structured_ingress_security.py
      - tests/test_client_pack_csv_redaction_ingress.py
      - tests/test_client_pack_copy_publication.py
      - tests/test_client_pack_publication_recovery.py
      - tests/test_client_pack_redaction_ingress.py
      - tests/test_safe_paths.py
      - tests/test_financial_input_policy.py
  - id: TB-002
    name: browser-api-ingress
    source: Browser or API caller, including untrusted actor and tenant headers.
    destination: FastAPI or local Studio application and domain authorization boundary.
    assets: [DC-003, DC-004, DC-005, DC-006]
    threats: [Authentication bypass, actor spoofing, self-approval, injection, cross-tenant access, token disclosure]
    controls: [SEC-C-003, SEC-C-004]
    evidence:
      - reconforge/api/dependencies.py
      - reconforge/api/security.py
      - reconforge/auth/policy.py
      - reconforge/auth/rbac.py
      - tests/test_api_dependencies.py
      - tests/test_api_auth.py
      - tests/test_policy_engine.py
      - tests/test_approval_sod.py
      - tests/test_approval_surface_inventory.py
  - id: TB-003
    name: local-process-storage
    source: ReconForge application services running as the local operating-system user.
    destination: SQLite databases, local files, reports, evidence, and backups.
    assets: [DC-002, DC-003, DC-004, DC-005, DC-006]
    threats: [Unauthorized filesystem access, partial commit, backup disclosure, overwrite, tampered artifact]
    controls: [SEC-C-001, SEC-C-005, SEC-C-006, SEC-C-007, SEC-C-008]
    evidence:
      - reconforge/db/backup.py
      - reconforge/db/importers.py
      - reconforge/audit/events.py
      - tests/test_db_backup_restore.py
      - tests/test_db_backup_structured_ingress.py
      - tests/test_db_import_structured_ingress.py
      - tests/test_atomic_legacy_services.py
  - id: TB-004
    name: tenant-server-persistence
    source: Authenticated server application with transaction-local tenant and principal context.
    destination: PostgreSQL repositories and tenant-scoped server metadata.
    assets: [DC-003, DC-004, DC-005, DC-006]
    threats: [Tenant escape, stale principal, missing RLS context, unsafe query, incomplete repository migration]
    controls: [SEC-C-003, SEC-C-004, SEC-C-005]
    evidence:
      - reconforge/infrastructure/postgres.py
      - reconforge/infrastructure/postgres_identity.py
      - tests/test_postgres_foundation.py
      - tests/test_api_server_identity.py
  - id: TB-005
    name: optional-network-dependencies
    source: Explicit server adapters and workers.
    destination: Redis, S3-compatible object storage, and configured external publisher boundary.
    assets: [DC-003, DC-004, DC-005, DC-006]
    threats: [Credential leakage, wrong-tenant key, insecure transport, SSRF-like endpoint misuse, duplicate or lost delivery]
    controls: [SEC-C-004, SEC-C-005, SEC-C-009, SEC-C-010]
    evidence:
      - reconforge/infrastructure/redis.py
      - reconforge/infrastructure/object_storage.py
      - tests/test_redis_foundation.py
      - tests/test_object_storage_foundation.py
  - id: TB-006
    name: artifact-disclosure
    source: Local reports, evidence binders, client packs, anonymized exports, and backups.
    destination: Any person, support channel, auditor, client, or external storage outside the workspace.
    assets: [DC-003, DC-004, DC-005]
    threats: [Unauthorized disclosure, incomplete redaction, reversible anonymization, checksum overclaim, local path leakage]
    controls: [SEC-C-006, SEC-C-007, SEC-C-008, SEC-C-009]
    evidence:
      - reconforge/reports/client_pack.py
      - reconforge/anonymizer/engine.py
      - tests/test_client_pack_csv_redaction_ingress.py
      - tests/test_client_pack_financial_input_policy.py
      - tests/test_client_pack_redaction_ingress.py
      - tests/test_anonymizer.py
  - id: TB-007
    name: source-build-release
    source: Contributor worktree, dependencies, CI runners, and build configuration.
    destination: Source archive, wheel, container image, SBOM, and release surfaces.
    assets: [DC-001, DC-002, DC-006]
    threats: [Dependency drift, secret inclusion, unreviewed workflow code, dirty-tree release, unsigned artifact]
    controls: [SEC-C-008, SEC-C-010]
    evidence:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - .github/scripts/build_release_sboms.py
      - tests/test_release_readiness_docs.py
      - tests/test_maturity_policy.py

controls:
  - id: SEC-C-001
    name: bounded-path-and-output-safety
    status: implemented-bounded
    owner: platform-security
    purpose: Restrict supported local path operations and reject traversal or unsafe output overlap.
    boundaries: [TB-001, TB-003]
    data_classes: [DC-001, DC-002, DC-003]
    code_evidence: [reconforge/utils/safe_paths.py]
    test_evidence: [tests/test_safe_paths.py]
    limitations: [Operating-system permissions and arbitrary legacy caller paths remain deployment responsibilities.]
  - id: SEC-C-002
    name: strict-financial-bounded-structured-and-tabular-ingress
    status: implemented-bounded
    owner: financial-integrity
    purpose: Preserve exact financial lexemes, bound supported file and AP/AR persisted-idempotency JSON structures, reject ambiguous or unsafe YAML/JSON, and preflight supported tabular files before parsing.
    boundaries: [TB-001]
    data_classes: [DC-002, DC-003]
    code_evidence: [reconforge/io/ingress.py, reconforge/io/readers.py, reconforge/io/structured.py, reconforge/io/generated.py, reconforge/io/persisted.py, reconforge/reports/client_pack.py, reconforge/evidence/binder.py, reconforge/utils/money.py, reconforge/utils/yaml.py, docs/security/file-ingestion-inventory.v1.yaml]
    test_evidence: [tests/test_file_ingress_security.py, tests/test_structured_ingress_security.py, tests/test_close_workflow_structured_ingress.py, tests/test_generated_manifest_structured_ingress.py, tests/test_client_pack_redaction_ingress.py, tests/test_client_pack_csv_redaction_ingress.py, tests/test_client_pack_copy_publication.py, tests/test_client_pack_publication_recovery.py, tests/test_evidence_review_csv_ingress.py, tests/test_generated_report_ingress.py, tests/test_studio_artifact_ingress.py, tests/test_financial_idempotency_json.py, tests/test_file_ingestion_inventory.py, tests/test_financial_input_policy.py, tests/test_config_financial_input_policy.py]
    limitations: [Legacy XLS internals, observer/crash-atomic existing-directory client-pack and database-export replacement, real host/filesystem-loss recovery, malware scanning, source/actor authenticity, and explicit public financial compatibility readers remain open; bounded AP/AR idempotency, audit metadata, PostgreSQL outbox/reconciliation, SQLite matching rules/lineage/export, Redis sessions, manifests/copies/redaction/generated reports/review state, unkeyed recovery markers, and close templates are not authenticated or approved.]
  - id: SEC-C-003
    name: authentication-principal-and-rbac
    status: partial
    owner: identity-security
    purpose: Hash local credentials and sessions, bind server principals, require named permissions and supplied scope grants in the central policy primitive, and prohibit creator self-approval across inventoried platform approval/review services.
    boundaries: [TB-002, TB-004]
    data_classes: [DC-003, DC-004, DC-005, DC-006]
    code_evidence: [reconforge/auth/passwords.py, reconforge/auth/policy.py, reconforge/auth/rbac.py, reconforge/api/dependencies.py, reconforge/platform/approvals.py, reconforge/infrastructure/postgres_identity.py]
    test_evidence: [tests/test_auth_passwords.py, tests/test_api_dependencies.py, tests/test_api_server_identity.py, tests/test_policy_engine.py, tests/test_approval_sod.py, tests/test_approval_surface_inventory.py, tests/test_workflow_state_machine.py]
    limitations: [Trusted-local labels are covered by the bounded no-self-approval comparator but are not enterprise principals; universal route/repository ABAC, amount/region/data-class rules, delegated or emergency access, OIDC, SAML, SCIM, and MFA are absent.]
  - id: SEC-C-004
    name: tenant-and-dependency-isolation
    status: partial
    owner: platform-security
    purpose: Scope local tenant paths, PostgreSQL transactions, Redis keys, and object keys to validated tenant identities.
    boundaries: [TB-002, TB-004, TB-005]
    data_classes: [DC-003, DC-004, DC-005, DC-006]
    code_evidence: [reconforge/db/tenancy.py, reconforge/infrastructure/postgres.py, reconforge/infrastructure/redis.py, reconforge/infrastructure/object_storage.py]
    test_evidence: [tests/test_tenant_isolation.py, tests/test_postgres_foundation.py, tests/test_redis_foundation.py, tests/test_object_storage_foundation.py]
    limitations: [No end-to-end proof covers every repository, worker, cache, object, export, and restore path.]
  - id: SEC-C-005
    name: atomic-audit-and-outbox-evidence
    status: partial
    owner: domain-integrity
    purpose: Commit required business, audit, and outbox effects atomically on migrated mutation paths.
    boundaries: [TB-003, TB-004, TB-005]
    data_classes: [DC-003, DC-005]
    code_evidence: [reconforge/audit/events.py, reconforge/platform/outbox.py, reconforge/infrastructure/postgres_outbox.py, reconforge/io/persisted.py, reconforge/platform/payables.py, reconforge/platform/receivables.py]
    test_evidence: [tests/test_atomic_legacy_services.py, tests/test_outbox_delivery.py, tests/test_postgres_outbox.py, tests/test_financial_idempotency_json.py]
    limitations: [AP/AR idempotency JSON producer rejection and corrupt replay are rollback/no-new-effect tested locally; legacy services, remaining persisted fields, and external publisher idempotency are not fully covered.]
  - id: SEC-C-006
    name: evidence-and-report-integrity-metadata
    status: partial
    owner: evidence-security
    purpose: Bind selected local inputs and outputs to versioned policies and SHA-256 consistency metadata.
    boundaries: [TB-003, TB-006]
    data_classes: [DC-003, DC-005]
    code_evidence: [reconforge/evidence/binder.py, reconforge/reports/client_pack.py]
    test_evidence: [tests/test_evidence_binder_financial_input_policy.py, tests/test_client_pack_financial_input_policy.py, tests/test_client_pack_redaction_ingress.py, tests/test_generated_manifest_structured_ingress.py]
    limitations: [Hashes are not signatures, source authentication, disclosure approval, completeness proof, or audit opinions.]
  - id: SEC-C-007
    name: backup-restore-integrity
    status: implemented-bounded
    owner: workspace-data-owner
    purpose: Bound local DB import/restore JSON, check backup manifests and relationships, and avoid unsafe target replacement by default.
    boundaries: [TB-003, TB-006]
    data_classes: [DC-003, DC-004, DC-005]
    code_evidence: [reconforge/db/backup.py, reconforge/db/importers.py]
    test_evidence: [tests/test_db_backup_restore.py, tests/test_db_backup_structured_ingress.py, tests/test_db_export_import.py, tests/test_db_import_structured_ingress.py]
    limitations: [Local DB import and restore JSON is resource-bounded and duplicate-safe, but record semantics remain a compatibility contract; encryption, authenticated provenance, centralized authorization, cross-edition restore, real host-loss recovery, malware scanning, and DR exercises are absent.]
  - id: SEC-C-008
    name: secret-exclusion-and-claim-boundary
    status: implemented-bounded
    owner: release-security
    purpose: Exclude known credential/session material from sanitized exports, scan repository history/tree with redacted output, and prevent unsupported public maturity claims.
    boundaries: [TB-003, TB-006, TB-007]
    data_classes: [DC-001, DC-002, DC-004, DC-006]
    code_evidence: [reconforge/db/exporter.py, reconforge/modules/registry.py, .gitleaks.toml, .github/workflows/security.yml, .github/workflows/release.yml]
    test_evidence: [tests/test_db_export_import.py, tests/test_maturity_policy.py, tests/test_supply_chain_policy.py]
    limitations: [Local repository scans do not prove hosted enforcement, credential rotation, historical absence, or safe arbitrary customer uploads.]
  - id: SEC-C-009
    name: bounded-object-storage-and-sharing
    status: partial
    owner: evidence-security
    purpose: Use explicit tenant keys, TLS defaults, checksums, retention metadata, bounded staged client-pack redistribution, and opt-in redaction/anonymization boundaries.
    boundaries: [TB-005, TB-006]
    data_classes: [DC-003, DC-005, DC-006]
    code_evidence: [reconforge/infrastructure/object_storage.py, reconforge/anonymizer/engine.py, reconforge/reports/client_pack.py]
    test_evidence: [tests/test_object_storage_foundation.py, tests/test_anonymizer.py, tests/test_client_pack_redaction_ingress.py, tests/test_client_pack_csv_redaction_ingress.py, tests/test_client_pack_copy_publication.py, tests/test_client_pack_publication_recovery.py]
    limitations: [Client-pack JSON/CSV/text and non-redacted copying are resource-bounded and handled-failure rollback-safe, but redaction completeness, crash-atomic existing-directory replacement, malware scanning, authorized delivery, disclosure approval, and KMS integration remain absent.]
  - id: SEC-C-010
    name: pinned-ci-and-build-gates
    status: partial
    owner: release-security
    purpose: Pin third-party workflow actions and application resolution, then configure lint, type, test, security, build, Docker, SBOM, dependency-audit, secret-scan, and exception gates.
    boundaries: [TB-005, TB-007]
    data_classes: [DC-001, DC-002, DC-006]
    code_evidence: [uv.lock, docs/security/supply-chain-policy.v1.json, docs/security/supply-chain-exceptions.v1.json, .github/workflows/ci.yml, .github/workflows/security.yml, .github/workflows/release.yml, .github/scripts/validate_supply_chain_policy.py, .github/scripts/build_release_sboms.py]
    test_evidence: [tests/test_supply_chain_policy.py, tests/test_release_readiness_docs.py, tests/test_engine_parity_matrix.py]
    limitations: [Hosted locked Python 3.11/3.12, npm SRI completeness, clean reproducible image builds, signatures, provenance verification, and an executed four-cell engine matrix remain open.]

residual_risks:
  - risk_id: R-001
    owner: platform-security
    residual_risk: high
    controls: [SEC-C-003, SEC-C-004]
    rationale: Hosted isolation is bounded by repository and service coverage, not proven end to end.
  - risk_id: R-003
    owner: domain-integrity
    residual_risk: high
    controls: [SEC-C-005]
    rationale: Atomic audit/outbox migration remains incomplete across legacy mutations.
  - risk_id: R-004
    owner: financial-integrity
    residual_risk: high
    controls: [SEC-C-002]
    rationale: Public legacy financial readers and compatibility storage remain.
  - risk_id: R-007
    owner: identity-security
    residual_risk: medium
    controls: [SEC-C-003]
    rationale: Federation, MFA, provisioning, and full lifecycle controls are absent.
  - risk_id: R-008
    owner: platform-operations
    residual_risk: medium
    controls: [SEC-C-005]
    rationale: External transport, scheduling, and publisher idempotency are deployment gaps.
  - risk_id: R-011
    owner: identity-security
    residual_risk: high
    controls: [SEC-C-003]
    rationale: Trusted local actor compatibility and incomplete principal propagation remain.
  - risk_id: R-013
    owner: platform-operations
    residual_risk: high
    controls: [SEC-C-004, SEC-C-005]
    rationale: Multi-worker coordination is not active across the complete API/domain surface.
  - risk_id: R-014
    owner: evidence-security
    residual_risk: high
    controls: [SEC-C-006, SEC-C-009]
    rationale: Artifact delivery, malware scanning, authorization, and restore are not integrated.
  - risk_id: R-015
    owner: platform-persistence
    residual_risk: high
    controls: [SEC-C-004]
    rationale: PostgreSQL coverage is bounded and most domain persistence remains local SQLite.
  - risk_id: R-017
    owner: privacy-security
    residual_risk: high
    controls: [SEC-C-006, SEC-C-009]
    rationale: Deterministic anonymization and best-effort redaction can remain identifying.
  - risk_id: R-018
    owner: platform-security
    residual_risk: high
    controls: [SEC-C-001, SEC-C-002, SEC-C-009]
    rationale: Bounded tabular/structured preflight, bounded FI-005 evidence/review CSV, FI-006 reports, FI-007 Studio, FI-008 business-record, FI-009 DB JSON, FI-014 review-state JSON, FI-015 generated compatibility JSON, FI-016 local explanation JSON, AP/AR, PostgreSQL reconciliation, SQLite matching/export, and Redis session FI-013 JSON, exact direct tabular/JSON/YAML AST allowlists, and staged resource-bounded FI-012 copies cover selected JSON/CSV/text and non-redacted paths with handled-failure rollback plus explicit integrity-checked local interruption recovery, but not legacy XLS internals, observer/crash-atomic replacement, real host/filesystem-loss durability, malware quarantine, authenticated manifest/template/state provenance, actor/disclosure authorization, or future upload and connector surfaces.
