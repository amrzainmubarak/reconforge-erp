[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconforge-erp"
version = "0.7.1"
description = "Open-source reconciliation intelligence for ERP, inventory, GL, WIP, spare-parts, and workshop operations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "ReconForge ERP Maintainers"}
]
keywords = ["erp", "reconciliation", "odoo", "sap", "accounting", "inventory", "wip", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
  "defusedxml>=0.7.1",
  "fastapi>=0.111",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "tzdata>=2026.3",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7",
  "build>=1.2",
  "httpx>=0.27",
  "hypothesis==6.167.1",
  "jsonschema>=4.23",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "ruff>=0.5",
  "setuptools>=83",
  "types-PyYAML>=6.0",
  "wheel",
  "pillow>=12.3.0",
]
docs = [
  "mkdocs>=1.6",
]
duckdb = [
  "duckdb>=1.0",
]
server = [
  "alembic>=1.16",
  "boto3>=1.43.56",
  "psycopg[binary]>=3.2",
  "redis>=6.4",
  "sqlalchemy>=2.0",
]
observability = [
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-sdk==1.44.0",
]
backup = [
    "cryptography==50.0.0",
]
connectors = [
    "cryptography==50.0.0",
]
federation = [
    "joserfc==1.7.4",
    "python3-saml==1.16.0",
]
mfa = [
    "webauthn==3.0.0",
]

[project.scripts]
reconforge = "reconforge.cli:app"

[tool.setuptools.packages.find]
include = ["reconforge*"]

[tool.setuptools]
py-modules = ["reconforge_migration_sql"]

[tool.setuptools.package-data]
"reconforge.data" = ["*.json"]

[tool.setuptools.data-files]
"." = ["alembic.ini"]
"alembic" = ["alembic/env.py", "alembic/script.py.mako"]
"alembic/versions" = ["alembic/versions/*.py"]

[tool.uv]
# Keep application resolution reproducible and fail when an unreviewed uv
# version attempts to rewrite the universal lock. Move the cutoff only in a
# reviewed dependency-update change that regenerates and audits uv.lock.
required-version = "==0.11.32"
exclude-newer = "2026-08-02T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --capture=sys"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "UP042"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
packages = ["reconforge"]
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = false
no_implicit_optional = true
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "pandas", "pandas.*"]
# Current NumPy stubs use Python 3.12 type-alias syntax and Pandas 3 stubs
# infer several DataFrame operations incompatibly under a Python 3.11 target.
# Runtime behavior remains covered by the Python test suite; keep this type
# gate focused on ReconForge code until the supported Python floor moves.
follow_imports = "skip"
