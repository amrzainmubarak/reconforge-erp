[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconforge-erp"
version = "0.3.0"
description = "Open-source reconciliation intelligence for ERP, inventory, GL, WIP, spare-parts, and workshop operations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "ReconForge ERP Maintainers"}
]
keywords = ["erp", "reconciliation", "odoo", "sap", "accounting", "inventory", "wip", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
  "fastapi>=0.111",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7",
  "build>=1.2",
  "httpx>=0.27",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]
docs = [
  "mkdocs>=1.6",
]
duckdb = [
  "duckdb>=1.0",
]

[project.scripts]
reconforge = "reconforge.cli:app"

[tool.setuptools.packages.find]
include = ["reconforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --capture=sys"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "UP042"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
packages = ["reconforge"]
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = false
no_implicit_optional = true
